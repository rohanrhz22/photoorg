<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Phone Storage Report — Xiaomi 14 Civi</title>
<style>
 :root{--bg:#0f1420;--card:#182234;--card2:#1f2c42;--line:#2b3a55;--txt:#e6edf7;--mut:#93a3bd;
  --sys:#ef4444;--extracted:#a855f7;--media:#3b82f6;--reclaim:#f59e0b;--documents:#22c55e;--personal:#64748b;}
 *{box-sizing:border-box}
 body{margin:0;background:linear-gradient(160deg,#0b0f1a,#0f1420);color:var(--txt);
  font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:14px}
 .wrap{max-width:1120px;margin:0 auto;padding:22px}
 h1{font-size:22px;margin:0 0 2px}
 .sub{color:var(--mut);font-size:12.5px;margin-bottom:16px}
 .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
 .card .k{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
 .card .v{font-size:21px;font-weight:700;margin-top:3px}
 .card .v small{font-size:12px;color:var(--mut);font-weight:400}
 .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
 .badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px;border-radius:20px;
  border:1px solid var(--line);background:var(--card2);cursor:pointer;user-select:none}
 .badge .dot{width:9px;height:9px;border-radius:50%}
 .badge.active{outline:2px solid #ffffff55}
 .dot.system{background:var(--sys)}.dot.extracted{background:var(--extracted)}.dot.media{background:var(--media)}
 .dot.reclaim{background:var(--reclaim)}.dot.documents{background:var(--documents)}.dot.personal{background:var(--personal)}
 .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
 input#q{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:9px 12px;font-size:13px}
 button.btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;
  padding:8px 12px;font-size:12.5px;cursor:pointer}
 button.btn:hover{background:#26344d}
 .head{display:flex;align-items:center;padding:8px 10px;color:var(--mut);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line)}
 .head .hnm{flex:1}.head .hbadge{width:110px}.head .hbar{width:170px}.head .hsz{width:96px;text-align:right}
 .head .hfc{width:74px;text-align:right}.head .hsc{width:66px;text-align:right}
 .tree{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
 .row{display:flex;align-items:center;padding:6px 10px;border-bottom:1px solid #ffffff08;cursor:default}
 .node:last-child>.row{border-bottom:none}
 .row:hover{background:#ffffff08}
 .nm{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
 .nm .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .caret{width:16px;display:inline-block;text-align:center;color:var(--mut);cursor:pointer;
  transition:transform .12s;flex:0 0 auto}
 .caret.open{transform:rotate(90deg)}
 .caret.empty{visibility:hidden}
 .blvl{width:110px;flex:0 0 auto}
 .cbadge{font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:#dbe4f3}
 .bar{width:170px;flex:0 0 auto;background:#0c1220;border-radius:6px;height:12px;overflow:hidden;margin-right:6px}
 .bar i{display:block;height:100%;border-radius:6px}
 .sz{width:90px;flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums}
 .fc{width:74px;flex:0 0 auto;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
 .sc{width:66px;flex:0 0 auto;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
 .kids{display:none}
 .foot{color:var(--mut);font-size:11.5px;margin-top:14px;line-height:1.6}
 .b-system{background:rgba(239,68,68,.14);border-color:#ef444455}
 .b-extracted{background:rgba(168,85,247,.14);border-color:#a855f755}
 .b-media{background:rgba(59,130,246,.14);border-color:#3b82f655}
 .b-reclaim{background:rgba(245,158,11,.14);border-color:#f59e0b55}
 .b-documents{background:rgba(34,197,94,.14);border-color:#22c55e55}
 .b-personal{background:rgba(100,116,139,.14);border-color:#64748b55}
</style>
</head>
<body>
<div class="wrap">
 <h1>📱 Phone Storage Report — Xiaomi 14 Civi</h1>
 <div class="sub" id="sub"></div>
 <div class="cards" id="cards"></div>
 <div class="legend" id="legend"></div>
 <div class="toolbar">
   <input id="q" placeholder="Search folder name…" autocomplete="off"/>
   <button class="btn" id="expand">Expand all</button>
   <button class="btn" id="collapse">Collapse all</button>
 </div>
 <div class="tree">
   <div class="head">
     <div class="hnm">Folder</div><div class="hbadge">Category</div><div class="hbar">Share</div>
     <div class="hsz">Size</div><div class="hfc">Files</div><div class="hsc">Subs</div>
   </div>
   <div id="root"></div>
 </div>
 <div class="foot" id="foot"></div>
</div>
<script>
const TREE = __TREE__;
const META = __META__;
const CATCOLOR = {system:'#ef4444',extracted:'#a855f7',media:'#3b82f6',reclaim:'#f59e0b',documents:'#22c55e',personal:'#64748b'};
const CATLABEL = {system:'System',extracted:'Extracted',media:'Media',reclaim:'Reclaim',documents:'Documents',personal:'Personal'};
function hkb(kb){ if(kb>=1048576) return (kb/1048576).toFixed(2)+' GB'; if(kb>=1024) return (kb/1024).toFixed(1)+' MB'; return kb+' KB'; }
function gb(kb){ return (kb/1048576).toFixed(1); }
const maxL1 = Math.max.apply(null, TREE.map(n=>n.kb));
let activeCat='all';

// summary cards
const reclaimKb = TREE.filter(n=>n.cat==='reclaim').reduce((a,b)=>a+b.kb,0);
const extractedKb = TREE.filter(n=>n.cat==='extracted').reduce((a,b)=>a+b.kb,0);
document.getElementById('sub').textContent =
  'Path: /storage/emulated/0  •  Generated '+META.generated+'  •  Sizes are cumulative (folder + everything inside). Click a folder to expand its sub-folders.';
const cards=[
  ['Used by files','<span>'+gb(META.rootKb)+'</span> <small>GB</small>'],
  ['Device disk','<span>'+gb(META.diskUsedKb)+'</span> <small>/ '+gb(META.diskTotalKb)+' GB used</small>'],
  ['Free space','<span>'+gb(META.diskFreeKb)+'</span> <small>GB</small>'],
  ['Top folders','<span>'+META.nL1+'</span> <small>+ '+META.nL2+' sub + '+META.nL3+' sub-sub</small>'],
  ['Total files','<span>'+META.rootFiles.toLocaleString()+'</span>'],
  ['Reclaimable','<span>'+gb(reclaimKb+extractedKb)+'</span> <small>GB (reclaim+extracted)</small>'],
];
document.getElementById('cards').innerHTML = cards.map(c=>
  '<div class="card"><div class="k">'+c[0]+'</div><div class="v">'+c[1]+'</div></div>').join('');

// legend / category filter
const cats=['all','system','extracted','media','reclaim','documents','personal'];
document.getElementById('legend').innerHTML = cats.map(c=>{
  if(c==='all') return '<span class="badge active" data-cat="all"><span class="dot" style="background:#fff"></span>All</span>';
  return '<span class="badge" data-cat="'+c+'"><span class="dot '+c+'"></span>'+CATLABEL[c]+'</span>';
}).join('');
document.querySelectorAll('.legend .badge').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.legend .badge').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); activeCat=b.dataset.cat; applyFilters();
});

// build tree DOM
function makeNode(node, depth, parentKb, cat){
  const el=document.createElement('div'); el.className='node';
  const row=document.createElement('div'); row.className='row';
  const hasKids = node.children && node.children.length>0;
  const share = parentKb>0 ? Math.max(node.kb/parentKb*100, node.kb>0?0.8:0) : 0;
  const color = CATCOLOR[cat]||'#64748b';
  const badge = depth===0 ? '<span class="cbadge b-'+cat+'">'+CATLABEL[cat]+'</span>' : '';
  row.innerHTML =
    '<div class="nm" style="padding-left:'+(depth*18)+'px">'+
      '<span class="caret'+(hasKids?'':' empty')+'">▶</span>'+
      '<span class="txt" title="'+esc(node.name)+'">'+esc(node.name.trim()||node.name)+'</span></div>'+
    '<div class="blvl">'+badge+'</div>'+
    '<div class="bar"><i style="width:'+share.toFixed(1)+'%;background:'+color+'"></i></div>'+
    '<div class="sz">'+hkb(node.kb)+'</div>'+
    '<div class="fc">'+node.files.toLocaleString()+'</div>'+
    '<div class="sc">'+(node.subs||0)+'</div>';
  el.appendChild(row);
  node._el=el; node._cat=cat;
  const caret=row.querySelector('.caret');
  if(hasKids){
    const kids=document.createElement('div'); kids.className='kids'; node._kids=kids;
    node.children.forEach(c=>kids.appendChild(makeNode(c, depth+1, node.kb, cat)));
    el.appendChild(kids);
    const toggle=()=>{ const open=kids.style.display==='block'; kids.style.display=open?'none':'block'; caret.classList.toggle('open',!open); };
    caret.onclick=toggle; row.querySelector('.txt').style.cursor='pointer'; row.querySelector('.txt').onclick=toggle;
  }
  return el;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const rootEl=document.getElementById('root');
TREE.forEach(n=>rootEl.appendChild(makeNode(n,0,maxL1,n.cat)));

function setOpen(node,open){ if(node._kids){ node._kids.style.display=open?'block':'none';
  node._el.querySelector('.caret').classList.toggle('open',open);} 
  if(node.children) node.children.forEach(c=>setOpen(c,open)); }
document.getElementById('expand').onclick=()=>TREE.forEach(n=>setOpen(n,true));
document.getElementById('collapse').onclick=()=>TREE.forEach(n=>setOpen(n,false));

// filtering
function vis(node,term){
  const self = !term || node.name.toLowerCase().includes(term);
  let childVis=false;
  if(node.children) node.children.forEach(c=>{ if(vis(c,term)) childVis=true; });
  const show = self||childVis;
  node._el.style.display = show?'':'none';
  if(term && childVis && node._kids){ node._kids.style.display='block'; node._el.querySelector('.caret').classList.add('open'); }
  return show;
}
function applyFilters(){
  const term=document.getElementById('q').value.trim().toLowerCase();
  TREE.forEach(n=>{
    if(activeCat!=='all' && n.cat!==activeCat){ n._el.style.display='none'; return; }
    vis(n,term);
  });
}
document.getElementById('q').addEventListener('input',applyFilters);

document.getElementById('foot').innerHTML =
 'Legend: <b>System</b> = untouched app/OS folders • <b>Extracted</b> = media pulled out of Android app storage • '+
 '<b>Media</b> = organised photo/video libraries • <b>Reclaim</b> = large, safe to back-up &amp; delete • '+
 '<b>Documents</b> • <b>Personal</b>.<br>'+
 'Loose files in storage root: '+META.rootLoose+'. Depth-3 shown for all folders except <b>Android</b> (capped at depth 2 — it holds thousands of app sub-dirs).';
</script>
</body>
</html>
