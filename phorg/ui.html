<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>phorg — Storage Organizer</title>
<style>
:root{
  --bg0:#0b0f1a; --bg1:#0f1420; --card:#151d2e; --card2:#1b2740; --line:#2a3a58;
  --txt:#e8eef9; --mut:#93a3bd; --mut2:#6b7a97;
  --accent:#4f8cff; --accent2:#7c5cff; --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  --media:#3b82f6; --docs:#22c55e; --system:#ef4444; --extracted:#a855f7;
  --reclaim:#f59e0b; --personal:#64748b;
  --shadow:0 10px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--txt);font:14px/1.5 'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  background:radial-gradient(1200px 700px at 12% -8%,#182036 0%,transparent 60%),
             radial-gradient(1000px 700px at 110% 0%,#20183a 0%,transparent 55%),
             linear-gradient(160deg,var(--bg0),var(--bg1));
  background-attachment:fixed;}
::selection{background:#4f8cff55}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* layout */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{border-right:1px solid var(--line);padding:20px 16px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:6px;background:rgba(10,14,24,.55);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:11px;margin:2px 6px 20px}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px #4f8cff44}
.brand b{font-size:17px;letter-spacing:.2px}
.brand span{display:block;font-size:11px;color:var(--mut);font-weight:400;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;background:transparent;border:0;color:var(--mut);
  padding:10px 12px;border-radius:10px;text-align:left;width:100%;transition:.15s}
.nav button .ic{width:20px;text-align:center;font-size:16px}
.nav button:hover{background:#ffffff0d;color:var(--txt)}
.nav button.active{background:linear-gradient(90deg,#4f8cff22,#7c5cff11);color:var(--txt);
  box-shadow:inset 0 0 0 1px #4f8cff33}
.nav button:disabled{opacity:.4;cursor:not-allowed}
.side .foot{margin-top:auto;font-size:11px;color:var(--mut2);padding:10px 8px;line-height:1.6}
.conn-pill{margin:0 6px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);font-size:12px;color:var(--mut)}
.conn-pill b{color:var(--txt);display:block;font-size:12.5px;word-break:break-all}
.conn-pill .st{display:inline-flex;align-items:center;gap:6px;margin-bottom:5px;font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut2)}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}

.main{padding:30px 34px 60px;max-width:1180px;width:100%}
.page{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:24px;margin:0 0 4px}
.lead{color:var(--mut);margin:0 0 24px;font-size:13.5px}

/* cards */
.card{background:linear-gradient(180deg,var(--card),#131a2a);border:1px solid var(--line);
  border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.card+.card{margin-top:18px}
.grid{display:grid;gap:16px}
.stat-grid{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
.stat .k{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:26px;font-weight:750;margin-top:5px;line-height:1.1}
.stat .v small{font-size:12px;color:var(--mut);font-weight:500}
.stat .spark{position:absolute;right:-6px;bottom:-10px;font-size:52px;opacity:.06}

/* connection page */
.choose{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.choice{border:1.5px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;transition:.18s;
  background:var(--card);position:relative}
.choice:hover{border-color:var(--accent);transform:translateY(-2px)}
.choice.sel{border-color:var(--accent);box-shadow:0 0 0 3px #4f8cff2a}
.choice .big{font-size:34px}
.choice h3{margin:12px 0 4px;font-size:17px}
.choice p{margin:0;color:var(--mut);font-size:12.5px}
.choice .check{position:absolute;top:14px;right:16px;color:var(--accent);font-size:18px;opacity:0;transition:.15s}
.choice.sel .check{opacity:1}

label.fld{display:block;margin:16px 0 6px;font-size:12.5px;color:var(--mut);font-weight:600}
input[type=text],select{width:100%;background:var(--bg1);border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:11px 13px;font-size:13.5px;transition:.15s}
input[type=text]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #4f8cff22}
.row{display:flex;gap:10px;align-items:center}
.row input[type=text]{flex:1}

.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;padding:11px 20px;
  border-radius:11px;font-weight:650;font-size:13.5px;transition:.15s;box-shadow:0 6px 18px #4f8cff33}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
.btn.ghost{background:var(--card2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.warn{background:linear-gradient(135deg,#f59e0b,#ef4444);box-shadow:0 6px 18px #ef444433}
.btn.sm{padding:8px 14px;font-size:12.5px;border-radius:9px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

/* toggles */
.toggle{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px;cursor:pointer}
.toggle input{display:none}
.tk{width:40px;height:22px;border-radius:20px;background:#2b3a58;position:relative;transition:.18s;flex:none}
.tk::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:.18s}
.toggle input:checked+.tk{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.toggle input:checked+.tk::after{left:20px}
.toggle .desc{color:var(--mut);font-size:11.5px}

/* operations */
.op-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.op{border:1px solid var(--line);border-radius:15px;padding:18px;background:var(--card);cursor:pointer;
  transition:.18s;position:relative;overflow:hidden}
.op:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 30px #0006}
.op .oic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;margin-bottom:12px}
.op h3{margin:0 0 5px;font-size:15.5px}
.op p{margin:0;color:var(--mut);font-size:12.5px;min-height:34px}
.op .go{margin-top:12px;color:var(--accent);font-size:12.5px;font-weight:600}
.op.selected{border-color:var(--accent);box-shadow:0 0 0 2px #4f8cff33}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.bar{display:grid;grid-template-columns:180px 1fr 92px;align-items:center;gap:12px;font-size:12.5px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
 .bar .track{display:block;height:12px;border-radius:8px;background:#0d1424;overflow:hidden;border:1px solid #23324e}
 .bar .fill{display:block;height:100%;min-width:3px;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bar .amt{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}

/* preview */
.preview{margin-top:18px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.preview .ph{padding:14px 18px;background:var(--card2);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#0e1626;border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:11.5px;color:var(--mut)}
.chip b{color:var(--txt)}
.oplist{max-height:320px;overflow:auto;font:12px/1.5 'Cascadia Code',Consolas,monospace}
.oprow{display:flex;gap:10px;padding:7px 18px;border-top:1px solid #1c2740;align-items:center}
.oprow:nth-child(odd){background:#0e152322}
.oprow .tag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;flex:none}
.tag.move{background:#4f8cff22;color:#8fb6ff}
.tag.mkdir{background:#22c55e22;color:#7ee6a6}
.tag.rmdir{background:#f59e0b22;color:#f5c877}
.oprow .pth{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oprow .arw{color:var(--mut2)}
.oprow .dst{color:var(--txt)}

.callout{border-radius:12px;padding:13px 16px;font-size:12.5px;display:flex;gap:10px;align-items:flex-start}
.callout.safe{background:#22c55e14;border:1px solid #22c55e33;color:#a7e9c1}
.callout.warn{background:#f59e0b14;border:1px solid #f59e0b33;color:#f3d59a}
.callout.info{background:#4f8cff14;border:1px solid #4f8cff33;color:#a9c6ff}
.callout.bad{background:#ef444414;border:1px solid #ef444433;color:#f4a9a9}

/* modal */
.overlay{position:fixed;inset:0;background:#04070ecc;backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50}
.modal{width:min(560px,92vw);max-height:82vh;background:linear-gradient(180deg,var(--card),#121926);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.modal .mh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mh h3{margin:0;font-size:16px}
.modal .mb{padding:12px 12px;overflow:auto}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.crumbs{padding:2px 8px 10px;color:var(--mut);font-size:12px;word-break:break-all}
.fitem{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:10px;cursor:pointer;transition:.12s}
.fitem:hover{background:#ffffff0d}
.fitem .fi{font-size:16px}
.x{background:transparent;border:0;color:var(--mut);font-size:20px;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{background:#ffffff11;color:var(--txt)}

/* toast */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:80}
.toast{min-width:240px;max-width:360px;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);
  font-size:13px;display:flex;gap:10px;align-items:flex-start;animation:slide .25s ease;border:1px solid var(--line);background:var(--card2)}
.toast.good{border-color:#22c55e55}.toast.bad{border-color:#ef444455}.toast.info{border-color:#4f8cff55}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

.spin{width:16px;height:16px;border:2.5px solid #ffffff44;border-top-color:#fff;border-radius:50%;
  display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.empty .big{font-size:44px;opacity:.5}
.sect-t{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:26px 0 12px}
details.advbox{margin:8px 0 0}
details.advbox>summary{cursor:pointer;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin:18px 0 10px;list-style:none;user-select:none}
details.advbox>summary::-webkit-details-marker{display:none}
details.advbox>summary::before{content:"▸ ";color:var(--accent)}
details.advbox[open]>summary::before{content:"▾ "}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px 22px;margin-top:6px} /* thumbnail review grid */
 .cardh{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
 .presetbar{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;
   background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
 .orline{text-align:center;color:var(--mut2);font-size:12px;margin:14px 0 10px}
 .subhint{color:var(--mut);font-size:11.5px;margin-top:8px}
 .grp-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:600;font-size:14px}
 .grp-h .cnt{color:var(--mut);font-size:12px;font-weight:400}
 .grp-h .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
 .thumbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px}
 .thumb{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;user-select:none}
 .thumb.sel{outline:2px solid var(--accent);border-color:var(--accent)}
 .thumb img{width:100%;height:92px;object-fit:cover;border-radius:6px;background:#0d1424;display:block}
 .thumb .cb{position:absolute;top:9px;left:9px;width:18px;height:18px;accent-color:var(--accent);cursor:pointer;z-index:2}
 .thumb .nm{color:var(--mut);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:5px 2px 4px}
 .thumb select{width:100%;font-size:10.5px;padding:4px 6px;border-radius:6px;background:var(--bg1);color:var(--txt);border:1px solid var(--line)}
 .bulkbar{position:sticky;top:8px;z-index:6;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:var(--card2);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
 .bulkbar b{color:var(--txt)} .bulkbar select{font-size:12px;padding:6px 10px;border-radius:8px;background:var(--bg1);color:var(--txt);border:1px solid var(--line)}
 .grp-h select{margin-left:auto;font-size:11px;padding:3px 8px;border-radius:6px;background:var(--bg1);color:var(--txt);border:1px solid var(--line);font-weight:400}
 /* cluster cards */
 .clustergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
 .clustercard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
 .clustercard.sel{outline:2px solid var(--accent);border-color:var(--accent)}
 .clustercard img{width:100%;height:120px;object-fit:cover;border-radius:8px;background:#0d1424;display:block;cursor:zoom-in}
 .clustercard .cc{color:var(--mut);font-size:11.5px;margin:6px 2px 6px}
 .clustercard .ccb{position:absolute;top:14px;left:14px;width:18px;height:18px;accent-color:var(--accent);cursor:pointer;z-index:2}
 .clustercard input{width:100%;font-size:12px;padding:6px 8px;border-radius:7px;background:var(--bg1);color:var(--txt);border:1px solid var(--line)}
 .clustercard .sug{color:var(--good);font-size:10.5px;margin:4px 2px 0}
 /* lightbox */
 .lbov{position:fixed;inset:0;background:#04070ee6;backdrop-filter:blur(4px);display:flex;flex-direction:column;z-index:90}
 .lbtop{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;color:var(--txt)}
 .lbtop .lbname{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .lbmain{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 14px;min-height:0}
 .lbmain img{max-width:82vw;max-height:76vh;object-fit:contain;border-radius:10px;box-shadow:var(--shadow);background:#0d1424}
 .lbnav{background:#ffffff14;border:1px solid var(--line);color:#fff;width:46px;height:46px;border-radius:50%;font-size:22px;flex:none}
 .lbnav:hover{background:#ffffff26}
 .lbmeta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 18px 20px}
 .lbchip{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--mut)}
 .lbchip b{color:var(--txt)}
 /* editable gallery preview */
 .galhint{padding:2px 20px 8px;color:var(--mut);font-size:12.5px} .galrm{position:absolute;top:8px;right:8px;z-index:3;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--line);background:#1a1030cc;color:#ff8a8a;font-size:13px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;opacity:.85}
 .galrm:hover{background:#3a1420;border-color:var(--bad);opacity:1}
 /* drag-drop overlay */
 #dropOverlay{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;  background:#04070ecc;backdrop-filter:blur(3px)}
 #dropOverlay.on{display:flex}
 #dropOverlay .dropinner{border:3px dashed var(--accent);border-radius:18px;padding:48px 70px;text-align:center;
  color:var(--txt);font-size:52px;background:var(--card)}
 #dropOverlay .dropinner div{font-size:16px;margin-top:12px;color:var(--mut)}
 /* accessibility */
 body.bigtext{font-size:18px} body.bigtext .desc,body.bigtext .ht,body.bigtext .lead{font-size:14px}
 body.contrast{--txt:#ffffff;--mut:#c7d2e0;--line:#4b5b78}
 body.contrast .callout,body.contrast .card,body.contrast .chip{border-width:2px}
 /* accent swatches + palette */
 .accentrow{display:flex;gap:10px;margin-top:6px}
 .swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
 .swatch.sel{border-color:var(--txt);box-shadow:0 0 0 2px var(--accent)}
 .fitem.psel{background:var(--card2);outline:1px solid var(--accent)}
 /* FaceFind selfie */
 .ffselfie{display:flex;gap:14px;align-items:center;margin-top:6px}
 .ffprev{width:88px;height:88px;border-radius:14px;border:2px dashed var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;background:var(--bg1)}
 .ffprev.drag{border-color:var(--accent);background:var(--card2)}
 .ffprev img{width:100%;height:100%;object-fit:cover}
 /* history */
 .histrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid #1c2740;font-size:13px}
 .rclist{display:flex;flex-direction:column;gap:2px;margin-top:8px}
 .rcrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid #1c2740}
 .rcrow:first-child{border-top:0}
 .rcrow .ri{font-size:18px;width:24px;text-align:center}
 .rcrow .rl{flex:1;display:flex;flex-direction:column;font-size:13px}
 .rcrow .rl b{color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
 .rcrow .rs{color:var(--mut);font-size:11.5px} .histrow:first-child{border-top:0}
 .histrow .hl{flex:1} .histrow .ht{color:var(--mut2);font-size:11.5px}
 /* sliders */
 .slider{margin:12px 0}
 .slider label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:6px}
 .slider label b{color:var(--txt)}
 .slider input[type=range]{width:100%;accent-color:var(--accent)}
 .slider .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--mut2);margin-top:2px}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.choose{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.bar{grid-template-columns:110px 1fr 70px}}
/* light theme */
body.light{--bg0:#dde6f6;--bg1:#eaf1fb;--card:#ffffff;--card2:#e3ecfb;--line:#c2d2ec;
  --txt:#0d1f47;--mut:#3d5588;--mut2:#6b7fa8;
  --accent:#1e40af;--accent2:#2563eb;
  --shadow:0 10px 30px rgba(20,40,90,.16)}
body.light{background:radial-gradient(1200px 700px at 12% -8%,#cfe0fb 0%,transparent 60%),
  radial-gradient(1000px 700px at 110% 0%,#d7e6ff 0%,transparent 55%),linear-gradient(160deg,#dde8fa,#eef4fd)}
body.light .side{background:rgba(233,240,253,.75);border-right:1px solid #c2d2ec}
body.light .card{background:linear-gradient(180deg,#ffffff,#f2f7ff);border-color:#cdddf3}
body.light .oprow:nth-child(odd){background:#1e40af08}
body.light .track,body.light .thumb img,body.light .clustercard img,body.light .lbmain img{background:#dbe6f7}
body.light .chip,body.light .stat{background:#e9f0fc}
body.light .preview .ph,body.light .bulkbar{background:#e3ecfb}
body.light .nav button.active{background:#d3e0f8;box-shadow:inset 0 0 0 1px #1e40af55}
body.light .btn.ghost{background:#e3ecfb}
/* treemap */
.tmap{width:100%;margin-top:14px}
.tmap .tmcrumb{font-size:12px;color:var(--mut);margin-bottom:8px}
.tmap .tmcrumb .tmc{cursor:pointer;color:var(--accent)}
.tmap .tmcrumb .tmc:hover{text-decoration:underline}
.tmbox{position:relative;width:100%;height:280px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.tmbox .tcell{position:absolute;overflow:hidden;border:1px solid #0b0f1a55;box-sizing:border-box;
  padding:6px 8px;color:#fff;font-size:11.5px;line-height:1.25;cursor:default;transition:filter .12s}
.tmbox .tcell.drill{cursor:pointer}
.tmbox .tcell:hover{filter:brightness(1.12)}
.tmbox .tcell b{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px #0007}
.tmbox .tcell span{opacity:.9;text-shadow:0 1px 2px #0007}
.themebtn{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  color:var(--txt);border-radius:10px;padding:8px 11px;margin:0 6px 10px;font-size:12.5px;width:calc(100% - 12px)}
.themebtn:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">🗂️</div>
      <div><b>phorg</b><span>Storage Organizer</span></div>
    </div>
    <div class="conn-pill" id="connPill">
      <div class="st"><span class="dot" id="connDot"></span><span id="connState">Not connected</span></div>
      <b id="connRoot">Choose a source to begin</b>
    </div>
    <nav class="nav" id="nav" style="margin-top:14px">
      <button data-page="connect" class="active"><span class="ic">🔌</span> Connect</button>
      <button data-page="dashboard" data-need="conn" disabled><span class="ic">📊</span> Dashboard</button>
      <button data-page="organize" data-need="conn" disabled><span class="ic">✨</span> Organize</button>
      <button data-page="photos" data-need="conn" disabled><span class="ic">🖼️</span> Photo AI</button>
      <button data-page="wedding" data-need="conn" disabled><span class="ic">💍</span> Wedding</button>
      <button data-page="facefind" data-need="conn" disabled><span class="ic">🙋</span> FaceFind</button>
      <button data-page="compress" data-need="conn" disabled><span class="ic">🗜️</span> Compress</button>
      <button data-page="report" data-need="conn" disabled><span class="ic">📄</span> Report</button>
      <button data-page="safety"><span class="ic">🛡️</span> Safety</button>
    </nav>
    <div class="foot">
      Files are only <b>moved</b>, never deleted. Every action previews first &amp;
      verifies the file count afterwards.
    </div>
    <button class="themebtn" id="themeBtn" title="Toggle light / dark">🌙 <span>Dark theme</span></button>
  </aside>

  <main class="main" id="main"></main>
</div>

<div id="modalHost"></div>
<div id="dropOverlay"><div class="dropinner">📂<div>Drop a folder to connect</div></div></div>
<div id="toasts"></div>

<script>
// ---------------------------------------------------------------- state
const S = {
  connected:false, backend:"local", root:"", adb:"", device:"",
  depth:3, recursive:false, sort:false, include_hidden:false, protect:"",
  scan:null, lastPlan:null, activeOp:null, page:"connect",
  photoCats:{blurry:true,single:true,couple:true,group:true,scenery:true,people:false,
    duplicates:true,similar:false,screenshot:true,document:true,best:false,video:true},
  people:[{name:"Bride",samples:""},{name:"Groom",samples:""}], photoJob:null,
  granularity:"month", useExif:true,
  blurThreshold:50, personThreshold:78, photoItems:[], photoTest:false,
  photoSel:new Set(), clusterJob:null, clusters:[], clusterSel:new Set(),
  renameTemplate:"{date}_{category}_{seq}", renameStart:1, renamePad:3, renameExt:"",
  copyMode:false,
};
const _ed=new Date();
const _eY=_ed.getFullYear();
const _eM=`${_eY}-${String(_ed.getMonth()+1).padStart(2,"0")}`;
const _eD=`${_eM}-${String(_ed.getDate()).padStart(2,"0")}`;
const OPS = {
  junk:{icon:"🧹",color:"#f59e0b",title:"Junk Sweep",
    desc:"Move temp, cache, zero-byte &amp; .tmp files into a review folder.",cmd:"junk"},
  cleanup:{icon:"✨",color:"#10b981",title:"Recommended Cleanup",
    desc:"One click: junk sweep → duplicate files → organize by type, all previewed together.",
    cmd:"cleanup",opt:["recursive"]},
  type:{icon:"📁",color:"#3b82f6",title:"Organize by Type",
    desc:"Sort into Images, Videos, Audio, Documents, Archives…",cmd:"type",opt:["recursive"]},
  date:{icon:"📅",color:"#06b6d4",title:"Sort Photos by Date",
    desc:"File photos &amp; videos into Year / Month folders by capture date.",cmd:"date",
    opt:["recursive"],choices:{key:"granularity",label:"Folder depth",
      options:[["month",`Year / Month  (e.g. ${_eY} / ${_eM})`],["year",`Year only  (e.g. ${_eY})`],
               ["day",`Year / Month / Day  (e.g. ${_eY} / ${_eM} / ${_eD})`]]}},
  size:{icon:"📏",color:"#7c5cff",title:"Organize by Size",
    desc:"Group files into size tiers, from Huge to Tiny.",cmd:"size",opt:["recursive"]},
  rename:{icon:"🔤",color:"#e879f9",title:"Bulk Rename",
    desc:"Rename files with a template like {date}_{category}_{seq}. Preview first.",
    cmd:"rename",opt:["recursive"],rename:true},
  "fix-ext":{icon:"🔧",color:"#22c55e",title:"Fix Extensions",
    desc:"Detect real file types by magic bytes &amp; repair extensions.",cmd:"fix-ext",opt:["sort","recursive"]},
  dedupe:{icon:"🧬",color:"#14b8a6",title:"Find Duplicate Files",
    desc:"Find byte-identical files anywhere in the tree &amp; move copies to a review folder.",cmd:"dedupe",dupe:true},
  "similar-names":{icon:"🪪",color:"#f43f5e",title:"Similar Filenames",
    desc:"Group “name (1).jpg”, “name-copy.jpg” style near-duplicates &amp; keep one.",cmd:"similar-names",opt:["recursive"]},
  flatten:{icon:"📤",color:"#f97316",title:"Flatten Folders",
    desc:"Pull files out of every sub-folder into this folder, then remove the empties.",cmd:"flatten"},
  location:{icon:"📍",color:"#0ea5e9",title:"Sort by Location",
    desc:"Group geotagged photos into Places/ folders by their GPS coordinates.",cmd:"location",opt:["recursive"]},
  empties:{icon:"🗑️",color:"#ef4444",title:"Remove Empty Folders",
    desc:"Recursively remove folders that contain no files.",cmd:"empties"},
};
const PHOTO_OP={icon:"🖼️",color:"#ec4899",title:"Categorize Photos (AI)",
  desc:"Sort images by content: portraits, groups, blurry, duplicates &amp; more."};

// ---------------------------------------------------------------- helpers
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function fmtKb(kb){kb=+kb||0;if(kb>=1048576)return (kb/1048576).toFixed(2)+" GB";
  if(kb>=1024)return (kb/1024).toFixed(1)+" MB";return kb+" KB";}
function num(n){return (+n||0).toLocaleString();}

async function api(path,body){
  const r = await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body||{})});
  const data = await r.json().catch(()=>({error:"Bad response"}));
  if(!r.ok||data.error) throw new Error(data.error||("HTTP "+r.status));
  return data;
}
let toastId=0;
function toast(msg,kind="info",ms=3800){
  const host=$("#toasts");const t=el("div","toast "+kind);
  const ic={good:"✅",bad:"⚠️",info:"ℹ️"}[kind]||"ℹ️";
  t.innerHTML=`<span>${ic}</span><span>${msg}</span>`;host.appendChild(t);
  setTimeout(()=>{t.style.opacity=0;t.style.transform="translateX(30px)";
    setTimeout(()=>t.remove(),250);},ms);
}
function busy(btn,on,label){
  if(!btn)return;
  if(on){btn.dataset.orig=btn.innerHTML;btn.disabled=true;
    btn.innerHTML=`<span class="spin"></span> ${label||"Working…"}`;}
  else{btn.disabled=false;btn.innerHTML=btn.dataset.orig||btn.innerHTML;}
}

// ---------------------------------------------------------------- nav
function setConn(on){
  S.connected=on;
  $("#connDot").classList.toggle("on",on);
  $("#connState").textContent=on?(S.backend==="adb"?"Phone connected":"Folder ready"):"Not connected";
  $("#connRoot").textContent=on?S.root:"Choose a source to begin";
  document.querySelectorAll('[data-need="conn"]').forEach(b=>b.disabled=!on);
}
function go(page){
  S.page=page;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  const m=$("#main");m.innerHTML="";
  ({connect:pageConnect,dashboard:pageDashboard,organize:pageOrganize,
    photos:pagePhotos,wedding:pageWedding,facefind:pageFaceFind,compress:pageCompress,report:pageReport,safety:pageSafety}[page]||pageConnect)(m);
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");
  if(!b||b.disabled)return;go(b.dataset.page);});

// ---------------------------------------------------------------- Connect page
function pageConnect(m){
  const p=el("div","page");
  const welcomed=(()=>{try{return localStorage.getItem("phorg-welcomed");}catch(e){return 1;}})();
  p.innerHTML=`
    <h1>Connect a source</h1>
    <p class="lead">Organize a folder on this PC, or an Android phone over USB (ADB).</p>
    ${welcomed?"":`<div class="callout info" id="welcomeTip" style="margin-bottom:16px">👋
      <div>Welcome! Pick a folder (or phone), then <b>preview</b> any action before it runs — nothing
      changes until you press <b>Apply</b>, the file count is re-verified, and you can always <b>Undo</b>.
      <a href="#" id="welcomeX">Got it</a></div></div>`}
    <div class="card">
      <div class="choose">
        <div class="choice ${S.backend==='local'?'sel':''}" data-b="local">
          <span class="check">●</span><div class="big">💻</div>
          <h3>Local folder</h3><p>Any folder on this computer — Downloads, a messy drive, backups…</p>
        </div>
        <div class="choice ${S.backend==='adb'?'sel':''}" data-b="adb">
          <span class="check">●</span><div class="big">📱</div>
          <h3>Android phone</h3><p>Connect over USB with debugging on. Requires ADB platform-tools.</p>
        </div>
      </div>
      <div id="connBody"></div>
    </div>`;
  m.appendChild(p);
  const wx=$("#welcomeX");if(wx)wx.onclick=e=>{e.preventDefault();
    try{localStorage.setItem("phorg-welcomed","1");}catch(_){}; $("#welcomeTip").remove();};
  p.querySelectorAll(".choice").forEach(c=>c.onclick=()=>{
    S.backend=c.dataset.b;p.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel"));
    c.classList.add("sel");renderConnBody();});
  renderConnBody();
}
function renderConnBody(){
  const host=$("#connBody");if(!host)return;
  if(S.backend==="local"){
    const recent=loadRecent();
    host.innerHTML=`
      <label class="fld">Folder to organize</label>
      <div class="row">
        <input type="text" id="rootIn" placeholder="e.g. C:\\Users\\me\\Downloads" value="${esc(S.root)}"/>
        <button class="btn ghost" id="browseBtn">📂 Browse</button>
      </div>
      ${recent.length?`<div style="margin-top:10px">
        <div style="color:var(--mut);font-size:11.5px;margin-bottom:5px">Recent folders</div>
        <div class="chips">${recent.map(r=>`<span class="chip" data-recent="${esc(r)}"
          style="cursor:pointer" title="${esc(r)}">📁 ${esc(r.split(/[\\/]/).pop()||r)}</span>`).join("")}</div></div>`:""}
      <div class="btn-row">
        <button class="btn" id="connectBtn">Connect &amp; scan →</button>
      </div>`;
    $("#browseBtn").onclick=()=>openBrowser();
    const ri=$("#rootIn");
    ri.oninput=e=>S.root=e.target.value.trim();
    ri.onkeydown=e=>{if(e.key==="Enter")doConnect();};
    ri.focus();
    host.querySelectorAll("[data-recent]").forEach(ch=>ch.onclick=()=>{
      S.root=ch.dataset.recent;$("#rootIn").value=S.root;doConnect();});
    $("#connectBtn").onclick=doConnect;
  } else {
    host.innerHTML=`
      <label class="fld">Path to adb (leave blank to auto-detect)</label>
      <input type="text" id="adbIn" placeholder="auto-detect" value="${esc(S.adb)}"/>
      <label class="fld">Device</label>
      <div class="row">
        <select id="devSel"><option value="">— detect devices —</option></select>
        <button class="btn ghost" id="detectBtn">🔍 Detect</button>
      </div>
      <label class="fld">Root path on phone</label>
      <input type="text" id="rootIn" value="${esc(S.root||'/storage/emulated/0')}"/>
      <div class="btn-row"><button class="btn" id="connectBtn">Connect &amp; scan →</button></div>`;
    $("#adbIn").oninput=e=>S.adb=e.target.value.trim();
    $("#rootIn").oninput=e=>S.root=e.target.value.trim();
    $("#devSel").onchange=e=>S.device=e.target.value;
    $("#detectBtn").onclick=detectDevices;
    $("#connectBtn").onclick=doConnect;
  }
}
async function detectDevices(e){
  const btn=e.target;busy(btn,true,"Detecting…");
  try{
    const d=await api("devices",{adb:S.adb});
    S.adb=d.adb;const sel=$("#devSel");sel.innerHTML="";
    if(!d.devices.length){sel.innerHTML='<option value="">No devices found</option>';
      toast("No phone detected. Enable USB debugging and tap Allow.","bad");}
    else{d.devices.forEach(dv=>{const o=el("option");o.value=dv.serial;
      o.textContent=(dv.model?dv.model+"  ":"")+"("+dv.serial+")";sel.appendChild(o);});
      S.device=d.devices[0].serial;toast(d.devices.length+" device(s) found","good");}
  }catch(err){toast(err.message,"bad");}finally{busy(btn,false);}
}
async function doConnect(e){
  if(!S.root){toast("Pick a folder or path first","bad");return;}
  const btn=$("#connectBtn");busy(btn,true,"Scanning…");
  try{
    const d=await api("scan",{backend:S.backend,root:S.root,adb:S.adb,device:S.device,depth:S.depth});
    S.scan=d;S.root=d.root;setConn(true);
    if(S.backend==="local"){pushRecent(d.root);
      try{localStorage.setItem("phorg-lastroot",d.root);localStorage.setItem("phorg-lastbackend",S.backend);}catch(e){}}
    toast("Connected — "+num(d.meta.rootFiles)+" files scanned","good");
    go("dashboard");
  }catch(err){toast(err.message,"bad");setConn(false);}finally{busy(btn,false);}
}
function loadRecent(){try{return JSON.parse(localStorage.getItem("phorg-recent")||"[]");}catch(e){return [];}}
function pushRecent(root){try{let r=loadRecent().filter(x=>x!==root);r.unshift(root);
  localStorage.setItem("phorg-recent",JSON.stringify(r.slice(0,6)));}catch(e){}}

// ---------------------------------------------------------------- folder browser modal
async function openBrowser(onPick, startPath){
  let cur=(startPath!=null?startPath:S.root)||"";
  const host=$("#modalHost");
  host.innerHTML=`<div class="overlay"><div class="modal">
    <div class="mh"><h3>📂 Choose a folder</h3><button class="x" id="mClose">×</button></div>
    <div class="crumbs" id="crumbs"></div>
    <div class="mb" id="fileList"></div>
    <div class="mf"><span style="color:var(--mut);font-size:12px" id="selPath"></span>
      <div class="row"><button class="btn ghost sm" id="upBtn">↑ Up</button>
      <button class="btn sm" id="pickBtn">Select this folder</button></div></div>
  </div></div>`;
  const close=()=>host.innerHTML="";
  $("#mClose").onclick=close;
  host.querySelector(".overlay").onclick=e=>{if(e.target===host.querySelector(".overlay"))close();};
  async function load(path){
    let d;try{d=await api("browse",{path});}catch(err){toast(err.message,"bad");return;}
    cur=d.path;$("#crumbs").textContent=d.path||"This PC";
    $("#selPath").textContent=d.path?("Selected: "+d.path):"";
    const list=$("#fileList");list.innerHTML="";
    $("#upBtn").disabled=(d.parent===null&&!d.drives.length);
    $("#upBtn").onclick=()=>load(d.parent||"");
    $("#pickBtn").disabled=!d.path;
    $("#pickBtn").onclick=()=>{
      if(onPick){onPick(d.path);}
      else{S.root=d.path;const ri=$("#rootIn");if(ri)ri.value=d.path;}
      close();};
    if(d.drives&&d.drives.length){d.drives.forEach(dr=>{
      const it=el("div","fitem",`<span class="fi">💽</span><span>${esc(dr.name)}</span>`);
      it.onclick=()=>load(dr.path);list.appendChild(it);});}
    if(d.home){const it=el("div","fitem",`<span class="fi">🏠</span><span>Home</span>`);
      it.onclick=()=>load(d.home);list.appendChild(it);}
    if(!d.dirs.length&&!(d.drives||[]).length)
      list.appendChild(el("div","empty","No sub-folders here."));
    d.dirs.forEach(f=>{const it=el("div","fitem",
      `<span class="fi">📁</span><span>${esc(f.name)}</span>`);
      it.onclick=()=>load(f.path);list.appendChild(it);});
  }
  load(cur);
}

// ---------------------------------------------------------------- Dashboard
function pageDashboard(m){
  const p=el("div","page");const sc=S.scan;const meta=sc?sc.meta:{};
  const tree=(sc?sc.tree:[]).slice();
  const useKb=tree.some(t=>(+t.kb||0)>0);
  const metric=t=>useKb?(+t.kb||0):(+t.files||0);
  // sort by whichever metric we're charting so the bars are meaningful
  tree.sort((a,b)=>metric(b)-metric(a));
  const maxV=Math.max(1,...tree.map(metric));
  const diskPct=meta.diskTotalKb?Math.round(meta.diskUsedKb/meta.diskTotalKb*100):0;
  p.innerHTML=`
    <h1>Dashboard</h1>
    <p class="lead">${esc(S.backend==='adb'?'Phone':'Folder')}: <b>${esc(S.root)}</b></p>
    <div class="grid stat-grid">
      <div class="stat"><div class="k">Total used</div><div class="v">${fmtKb(meta.rootKb)}</div><div class="spark">💾</div></div>
      <div class="stat"><div class="k">Files</div><div class="v">${num(meta.rootFiles)}</div><div class="spark">📄</div></div>
      <div class="stat"><div class="k">Top folders</div><div class="v">${tree.length}</div><div class="spark">📁</div></div>
      <div class="stat"><div class="k">Loose at root</div><div class="v">${num(meta.rootLoose)}</div><div class="spark">🧺</div></div>
      ${meta.diskTotalKb?`<div class="stat"><div class="k">Disk</div><div class="v">${diskPct}% <small>of ${fmtKb(meta.diskTotalKb)}</small></div><div class="spark">🗄️</div></div>`:""}
    </div>
    <div class="card" style="margin-top:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div><h3 style="margin:0">Largest folders</h3>
          <div style="color:var(--mut);font-size:11.5px;margin-top:2px">by ${useKb?"size on disk":"number of files"}</div></div>
        <button class="btn ghost sm" id="rescan">↻ Rescan</button>
      </div>
      <div class="bars" id="bars" style="margin-top:16px"></div>
    </div>
    <div class="card" style="margin-top:18px">
      <h3 style="margin:0">Storage map</h3>
      <div style="color:var(--mut);font-size:11.5px;margin-top:2px">Bigger blocks use more space — click a block with a › to zoom in.</div>
      <div class="tmap" id="tmap"></div>
    </div>
    <div class="card" id="searchCard" style="margin-top:18px">
      <h3 style="margin:0">Find a file</h3>
      <div style="color:var(--mut);font-size:11.5px;margin:2px 0 10px">Search the whole tree by name, then jump to its folder.</div>
      <input type="text" id="treeSearch" placeholder="🔎 Type a file name…" style="width:100%"/>
      <div id="searchResults" style="margin-top:10px"></div>
    </div>
    <div class="card" id="reclaimCard" style="margin-top:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div><h3 style="margin:0">Space you could reclaim</h3>
          <div style="color:var(--mut);font-size:11.5px;margin-top:2px">Duplicates, junk &amp; large old files — nothing is touched until you preview.</div></div>
        <button class="btn ghost sm" id="reclaimBtn">🔎 Scan for savings</button>
      </div>
      <div id="reclaimOut" style="margin-top:12px"></div>
    </div>
    <div class="card" id="histCard" style="margin-top:18px;display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div><h3 style="margin:0 0 6px">Recent activity</h3>
        <div style="color:var(--mut);font-size:11.5px;margin-bottom:6px">The most recent operation can be undone.</div></div>
        <button class="btn ghost sm" id="exportLog">⬇️ Export log (CSV)</button>
      </div>
      <div id="histList"></div>
    </div>
    <div class="btn-row"><button class="btn" id="toOrg">Organize this →</button></div>`;
  m.appendChild(p);
  const tm=$("#tmap");if(tm)renderTreemap(tm,tree);
  if(S.backend==="local")loadHistory();
  if(S.backend!=="local"){const rc=$("#reclaimCard");if(rc)rc.style.display="none";}
  const rcb=$("#reclaimBtn");if(rcb)rcb.onclick=doReclaim;
  const elog=$("#exportLog");if(elog)elog.onclick=exportAuditLog;
  const tsIn=$("#treeSearch");
  if(tsIn){let tmr;tsIn.oninput=e=>{clearTimeout(tmr);const q=e.target.value;
    tmr=setTimeout(()=>doTreeSearch(q),300);};}
  const bars=$("#bars");
  if(!tree.length){
    bars.appendChild(el("div","empty",'<div class="big">🎉</div>No sub-folders — nothing to chart.'));
  } else {
    tree.slice(0,14).forEach(t=>{
      const v=metric(t);
      const pct=Math.max(4,Math.round(v/maxV*100));
      const amt=useKb?fmtKb(t.kb):num(t.files)+" file"+(t.files==1?"":"s");
      const b=el("div","bar");
      b.innerHTML=`<span class="nm" title="${esc(t.name)} — ${fmtKb(t.kb)}, ${num(t.files)} files">${esc(t.name)}</span>
        <span class="track"><span class="fill" style="width:${pct}%"></span></span>
        <span class="amt" title="${num(t.files)} files">${amt}</span>`;
      bars.appendChild(b);
    });
  }
  $("#toOrg").onclick=()=>go("organize");
  $("#rescan").onclick=async e=>{busy(e.target,true,"Scanning…");
    try{S.scan=await api("scan",{backend:S.backend,root:S.root,adb:S.adb,device:S.device,depth:S.depth});
      go("dashboard");toast("Rescanned","good");}
    catch(err){toast(err.message,"bad");}finally{busy(e.target,false);}};
}
const OP_LABEL={junk:"🧹 Junk sweep",type:"📁 Organize by type",size:"📏 Organize by size",

async function loadHistory(){

function renderHistory(items,undoableId,redoable){
  const list=$("#histList");if(!list)return;

    const when=new Date(it.ts*1000).toLocaleString();
    return `<div class="histrow">
      <span class="hl">${esc(OP_LABEL[it.label]||it.label)} — <b>${num(it.moves)}</b> file(s)
        <span class="ht">· ${esc(when)}</span></span>

      <button class="btn ghost sm" data-undo-id="${esc(it.id)}">↩️ Undo</button>

async function exportAuditLog(e){
  const btn=e.target;busy(btn,true,"Exporting…");
  try{
    const d=await api("audit",{root:S.root});
    if(!d.rows.length){toast("No moves logged yet","info");busy(btn,false);return;}
    const esc2=s=>`"${String(s==null?"":s).replace(/"/g,'""')}"`;
    const lines=["timestamp,action,from,to"];
    d.rows.forEach(r=>lines.push([esc2(new Date((r.ts||0)*1000).toISOString()),
      esc2(OP_LABEL[r.label]||r.label),esc2(r.src),esc2(r.dst)].join(",")));
    const blob=new Blob([lines.join("\n")],{type:"text/csv"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download="phorg-audit-log.csv";document.body.appendChild(a);a.click();
    a.remove();URL.revokeObjectURL(url);
    toast(`Exported ${num(d.rows.length)} moves`,"good");
  }catch(err){toast(err.message,"bad");}finally{busy(btn,false);}
}

// live rename preview
async function loadRenameSamples(){
  if(!$("#rnTpl"))return;
  try{S._rnSamples=(await api("rename/sample",{backend:S.backend,root:S.root,
    recursive:S.recursive,only_ext:S.renameExt})).samples;}catch(e){S._rnSamples=[];}
  updateRenamePreview();
}
function applyTemplateJS(tpl,vals,seq){
  let s=tpl||"";
  const map={date:vals.date,category:vals.category,orig:vals.orig,parent:vals.parent,ext:vals.ext,n:seq,seq:seq};
  Object.keys(map).forEach(k=>{s=s.split("{"+k+"}").join(map[k]==null?"":map[k]);});
  return s.replace(/[\\/:*?"<>|]+/g,"_").replace(/\s+/g," ").trim().replace(/^[.\s]+|[.\s]+$/g,"")||"file";
}
function updateRenamePreview(){
  const box=$("#rnPreview");if(!box)return;
  const s=S._rnSamples||[];
  if(!s.length){box.style.display="none";return;}
  const pad=Math.max(1,S.renamePad||3);
  const rows=s.slice(0,3).map((v,i)=>{
    const seq=String((+S.renameStart||0)+i).padStart(pad,"0");
    const stem=applyTemplateJS(S.renameTemplate,v,seq);
    const nn=v.ext?`${stem}.${v.ext}`:stem;
    return `<div style="font-size:12.5px"><span style="color:var(--mut)">${esc(v.name)}</span> → <b>${esc(nn)}</b></div>`;
  }).join("");
  box.style.display="block";box.innerHTML=`<div style="margin-bottom:4px">✏️ Live preview</div>${rows}`;
}

  const p=loadPresets();const names=Object.keys(p);

    prog.innerHTML=done.map(d=>`<div class="histrow"><span class="hl">✅ ${esc(OP_LABEL[d.cmd]||d.cmd)}</span><span style="color:var(--mut)">${num(d.moves)} change(s)</span></div>`).join("")

// runs an apply/*-start job with a live progress bar + Stop; resolves to result
function runApplyJob(startPath,body,host){
  return new Promise((resolve,reject)=>{(async()=>{
    let d;try{d=await api(startPath,body);}catch(err){return reject(err);}
    const jobId=d.jobId;
    const verb=(body&&body._verb)||"Moved";
    host.innerHTML=`<div class="preview" style="margin-top:16px"><div class="ph">
      <div class="chips"><span class="chip" id="apStat">⚡ Working…</span></div>
      <button class="btn ghost sm" id="apCancel">Stop</button></div>
      <div style="padding:14px 18px"><div class="track" style="display:block;height:14px;border-radius:8px;background:#0d1424;border:1px solid #23324e;overflow:hidden">
        <div id="apBar" class="fill" style="display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2))"></div></div>
        <div id="apCount" style="color:var(--mut);font-size:12px;margin-top:8px">Preparing…</div></div></div>`;
    $("#apCancel").onclick=()=>{api("apply/cancel",{jobId}).catch(()=>{});const s=$("#apStat");if(s)s.textContent="Stopping…";};
    const poll=async()=>{
      let pr;try{pr=await api("apply/progress",{jobId});}catch(err){return reject(err);}
      const t=pr.total||0,dn=pr.done||0,pct=t?Math.round(dn/t*100):0;
      const bar=$("#apBar");if(bar)bar.style.width=pct+"%";
      const c=$("#apCount");if(c)c.textContent=t?`${verb} ${num(dn)} of ${num(t)} (${pct}%)`:"Working…";
      if(pr.error)return reject(new Error(pr.error));
      if(!pr.finished){setTimeout(poll,450);return;}
      resolve(pr.result);
    };poll();
  })();});
}
function renderApplyResult(host,d){
  let box="";
  if(d.cancelled)box=`<div class="callout warn" style="margin-top:16px">⏹️ Stopped — applied ${num(d.applied)} operation(s) before stopping.</div>`;
  else if(d.copyMode)box=`<div class="callout safe" style="margin-top:16px">✅ Done — copied ${num(d.copied||d.applied)} file(s). Originals left untouched${d.verified===true?` (count now <b>${num(d.after)}</b>)`:""}.</div>`;
  else if(d.verified===true)box=`<div class="callout safe" style="margin-top:16px">✅ Done — applied ${num(d.applied)} operation(s).
    File count verified unchanged (<b>${num(d.after)}</b>). No data lost.</div>`;
  else if(d.verified===false)box=`<div class="callout bad" style="margin-top:16px">⚠️ Applied ${num(d.applied)} operation(s), but file count changed
    ${num(d.before)} → ${num(d.after)}. Please review.</div>`;
  else box=`<div class="callout safe" style="margin-top:16px">✅ Done — applied ${num(d.applied)} item(s).</div>`;
  if(d.merged)box+=`<div class="callout info" style="margin-top:10px">🧬 Skipped ${num(d.merged)} file(s) that were already there identically (no duplicate <code>_1</code> copies made).</div>`;
  if(d.movedSummary&&d.movedSummary.length){
    box+=`<div class="card" style="margin-top:12px"><div style="color:var(--mut);font-size:12px;margin-bottom:6px">📂 Where things went</div>
      ${d.movedSummary.map(m=>`<div class="histrow"><span class="hl">${esc(m.folder)}</span><span style="color:var(--mut)">${num(m.count)} file(s)</span></div>`).join("")}</div>`;
  }
  if(d.log&&d.log.length)box+=`<div class="callout warn" style="margin-top:10px">${d.log.slice(0,6).map(esc).join("<br>")}</div>`;
  host.innerHTML=box+undoBar(d.undo);
  wireUndo(host,d.undo);
}
function undoBar(undo){
  if(!undo||!undo.available)return "";
  return `<div class="btn-row"><button class="btn ghost" data-undo="1">↩️ Undo all — ${num(undo.count)} file(s)</button>
    ${undo.count>1?`<button class="btn ghost" data-undo-part="1">📂 Undo only some folders…</button>`:""}</div>`;
}
function wireUndo(container,undo){
  if(!undo||!undo.available)return;
  const pb=container.querySelector("[data-undo-part]");
  if(pb)pb.onclick=()=>openPartialUndo(null);
  const b=container.querySelector("[data-undo]");if(!b)return;
  b.onclick=async e=>{
    busy(e.target,true,"Undoing…");
    try{
      const r=await api("undo",{root:undo.root});
      e.target.closest(".btn-row").innerHTML=
        `<div class="callout safe" style="width:100%">↩️ Undone — moved ${num(r.restored)} file(s) back to where they were.</div>`;
      toast("Undone","good");
      api("scan",{backend:S.backend,root:S.root,adb:S.adb,device:S.device,depth:S.depth})
        .then(sc=>S.scan=sc).catch(()=>{});
    }catch(err){toast(err.message,"bad");busy(e.target,false);}
  };
}

        <div id="pcount" style="color:var(--mut);font-size:12px;margin-top:8px">Preparing…</div></div></div>`;
    $("#cancelAnalyze").onclick=()=>{if(S.photoJob)api("categorize/cancel",{jobId:S.photoJob});};

async function pollAnalyze(btn){
  let d;try{d=await api("categorize/progress",{jobId:S.photoJob});}
  catch(err){toast(err.message,"bad");busy(btn,false);return;}
  const total=d.total||0,done=d.done||0;
  const pct=total?Math.round(done/total*100):0;
  const bar=$("#pbar");if(bar)bar.style.width=pct+"%";
  const pc=$("#pcount");if(pc)pc.textContent=total?`Analyzed ${num(done)} of ${num(total)} images (${pct}%)`:"Scanning for images…";
  const tally=$("#tally");
  if(tally){const t=d.tally||{};const keys=Object.keys(t);
    tally.innerHTML=keys.length?keys.map(k=>`<span class="chip">${esc(k.replace(/_/g," "))}: <b>${num(t[k])}</b></span>`).join(""):`<span class="chip">Analyzing…</span>`;}
  if(d.error){$("#photoProgress").innerHTML=`<div class="callout bad" style="margin-top:14px">${esc(d.error)}</div>`;busy(btn,false);return;}
  if(!d.finished){setTimeout(()=>pollAnalyze(btn),700);return;}
  // finished
  busy(btn,false);
  const res=d.result;
  const pe=res&&res.summary&&res.summary.people_error;
  if(pe)toast(pe,"info",6000);
  const items=(res&&res.summary&&res.summary.items)||[];
  const sorted=items.filter(it=>it.category);
  if(!sorted.length){
    $("#photoProgress").innerHTML=`<div class="callout safe" style="margin-top:14px">✅ Analysis done —
      nothing needed sorting${res&&res.cancelled?" (stopped early)":""}.</div>`;return;}
  const analyzed=(res.summary&&res.summary.analyzed)||0;
  $("#photoProgress").innerHTML=`<div class="callout safe" style="margin-top:14px">✅ Analyzed
    ${num(analyzed)} image(s)${S.photoTest?" (test sample)":""}. ${S.photoTest?"":"Review &amp; adjust below, then apply."}</div>`;
  renderPhotoGrid(items);
}

const FIXED_CATS=["Best_Shots","Blurry_Shaken","Duplicates","Similar_Extras","Group_Photos","Couples",

function wireGrid(opts){
  const out=$("#planOut");

    const i=+e.target.dataset.idx;const v=e.target.value;

  out.querySelectorAll("select[data-setall]").forEach(sel=>sel.onchange=e=>{
    const cat=e.target.dataset.setall;const v=e.target.value;if(!v)return;

      const list=orderedThumbs();
      if(e.shiftKey && S.selAnchor!=null){

          setSel(+list[k].querySelector(".cb").dataset.sel,true);}

  $("#photoApply").onclick=applyPhotoAssignments;
}

function openGallery(title,items,opts){

  const host=$("#modalHost");

    $("#galTitle").textContent=`${title} — ${num(list.length)} photos`;
    $("#galgrid").innerHTML=list.map((it,i)=>`<div class="thumb" style="cursor:zoom-in">
      ${removable?`<button class="galrm" data-rm="${i}" title="Remove from this group">✕</button>`:""}

function lbChips(it){
  const c=[];
  c.push(`<span class="lbchip">${it.category?catLabel(it.category):"⏸️ Leave in place"}</span>`);
  if(it.w&&it.h)c.push(`<span class="lbchip">📐 <b>${num(it.w)}×${num(it.h)}</b> · ${(it.w*it.h/1e6).toFixed(1)} MP</span>`);
  if(it.focus!=null)c.push(`<span class="lbchip">🔎 sharpness <b>${num(Math.round(it.focus))}</b>${it.blurry?" · blurry":""}</span>`);
  if(it.faces!=null)c.push(`<span class="lbchip">🙂 <b>${num(it.faces)}</b> face(s)</span>`);
  if(it.quality!=null)c.push(`<span class="lbchip">⭐ quality <b>${Math.round(it.quality*100)}%</b></span>`);
  if(it.video)c.push(`<span class="lbchip">🎬 video</span>`);
  if(it.person)c.push(`<span class="lbchip">👤 <b>${esc(it.person)}</b></span>`);
  if(it.dup)c.push(`<span class="lbchip">🔁 duplicate</span>`);
  if(it.similar)c.push(`<span class="lbchip">🪞 similar shot</span>`);
  if(it.screenshot)c.push(`<span class="lbchip">📱 screenshot</span>`);
  if(it.document)c.push(`<span class="lbchip">📄 document</span>`);
  return c.join("");
}

// -- auto-group people (clustering) -------------------------------------
async function doAutoGroup(e){
  const btn=e.target;busy(btn,true,"Checking…");
  const prog=$("#photoProgress");const out=$("#planOut");out.innerHTML="";
  try{
    const st=await api("cluster/status",{});
    if(!st.available){throw new Error(st.frozen?
      "Auto-grouping isn't available in this packaged build.":
      "Your OpenCV build lacks the face modules needed for auto-grouping.");}
    const d=await api("cluster/start",{backend:S.backend,root:S.root,
      include_hidden:S.include_hidden,protect:S.protect,recursive:S.recursive,
      people:S.people.filter(p=>p.name.trim()&&p.samples.trim())});
    S.clusterJob=d.jobId;
    prog.innerHTML=`<div class="preview" style="margin-top:14px"><div class="ph">
      <div class="chips" id="tally"><span class="chip">Starting…</span></div>
      <button class="btn ghost sm" id="cancelCluster">Stop</button></div>
      <div style="padding:14px 18px"><div class="track" style="display:block;height:14px;border-radius:8px;background:#0d1424;border:1px solid #23324e;overflow:hidden">
        <div id="pbar" class="fill" style="display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2))"></div></div>
        <div id="pcount" style="color:var(--mut);font-size:12px;margin-top:8px">Preparing…</div></div></div>`;
    $("#cancelCluster").onclick=()=>{if(S.clusterJob)api("cluster/cancel",{jobId:S.clusterJob});};
    pollCluster(btn);
  }catch(err){toast(err.message,"bad");busy(btn,false);}
}
async function pollCluster(btn){
  let d;try{d=await api("cluster/progress",{jobId:S.clusterJob});}
  catch(err){toast(err.message,"bad");busy(btn,false);return;}
  const bar=$("#pbar"),pc=$("#pcount"),tally=$("#tally");
  if(d.phase==="downloading"){
    const mt=d.model_total||0,md=d.model_done||0;const mp=mt?Math.round(md/mt*100):0;
    if(bar)bar.style.width=mp+"%";
    if(pc)pc.textContent=`Downloading face model ${mp}% (one-time)…`;
    if(tally)tally.innerHTML=`<span class="chip">Setting up AI…</span>`;
  }else{
    const total=d.total||0,done=d.done||0;const pct=total?Math.round(done/total*100):0;
    if(bar)bar.style.width=pct+"%";
    if(pc)pc.textContent=total?`Scanned ${num(done)} of ${num(total)} photos (${pct}%)`:"Scanning…";
    if(tally)tally.innerHTML=`<span class="chip">👥 ${num(d.clusters||0)} people found so far</span>`;
  }
  if(d.error){$("#photoProgress").innerHTML=`<div class="callout bad" style="margin-top:14px">${esc(d.error)}</div>`;busy(btn,false);return;}
  if(!d.finished){setTimeout(()=>pollCluster(btn),700);return;}
  busy(btn,false);
  const res=d.result;const clusters=(res&&res.clusters)||[];
  if(!clusters.length){$("#photoProgress").innerHTML=`<div class="callout safe" style="margin-top:14px">✅ Done — no recognizable faces found.</div>`;return;}
  const totalPhotos=clusters.reduce((s,c)=>s+c.count,0);
  $("#photoProgress").innerHTML=`<div class="callout safe" style="margin-top:14px">✅ Found <b>${num(clusters.length)}</b>
    recurring ${clusters.length===1?"person":"people"} across ${num(totalPhotos)} photo(s). Name the people you want, then file them.</div>`;
  renderClusters(clusters);
}
function renderClusters(clusters){
  S.clusters=clusters;S.clusterSel=new Set();
  clusters.forEach(c=>{if(c.name==null)c.name=c.suggested||"";});
  const out=$("#planOut");
  let html=`<div class="clustergrid">`;
  clusters.forEach((c,i)=>{
    const src="/api/thumb?size=300&path="+encodeURIComponent(c.rep);
    html+=`<div class="clustercard">
      <input type="checkbox" class="ccb" data-clsel="${i}" title="Select to merge"/>
      <img loading="lazy" src="${src}" data-cl-open="${i}" alt="" title="Click to preview all photos"/>
      <div class="cc">👤 ${num(c.count)} photo(s)</div>
      <button class="btn ghost sm" data-cl-open="${i}" style="width:100%;margin-bottom:6px">🔍 Preview all ${num(c.count)}</button>
      <input type="text" data-cl="${i}" placeholder="Name (blank = skip)" value="${esc(c.name)}"/>
      ${c.suggested?`<div class="sug">✓ looks like ${esc(c.suggested)}</div>`:""}
    </div>`;
  });
  html+=`</div>
    <div class="callout info" style="margin-top:16px">ℹ️ Click a face to flip through that person's photos.
      Tick two or more to <b>merge</b> them. Each photo is filed under its main subject's name; blank = skip.</div>
    <div class="btn-row">
      <button class="btn ghost" id="clusterMerge" style="display:none">🔗 Merge selected</button>
      <button class="btn warn" id="clusterApply">⚡ File named groups into folders</button>
      <button class="btn ghost" id="clusterCancel">Cancel</button>
    </div><div id="applyOut"></div>`;
  out.innerHTML=html;
  out.querySelectorAll("input[data-cl]").forEach(inp=>inp.oninput=e=>{
    S.clusters[+e.target.dataset.cl].name=e.target.value;});
  out.querySelectorAll("input[data-clsel]").forEach(cb=>cb.onchange=e=>{
    const i=+e.target.dataset.clsel;
    if(e.target.checked)S.clusterSel.add(i);else S.clusterSel.delete(i);
    e.target.closest(".clustercard").classList.toggle("sel",e.target.checked);
    const mb=$("#clusterMerge");if(mb)mb.style.display=S.clusterSel.size>=2?"inline-flex":"none";
  });
  out.querySelectorAll("[data-cl-open]").forEach(elm=>elm.onclick=e=>{
    e.preventDefault();
    const idx=+e.currentTarget.dataset.clOpen;
    const c=S.clusters[idx];
    const asItems=()=>c.members.map(pth=>({path:pth,name:pth.split(/[\\/]/).pop()}));
    openGallery(c.name||c.suggested||("Person — "+num(c.count)),asItems(),{
      onRemove:(item)=>{
        c.members=c.members.filter(p=>p!==item.path);
        c.count=c.members.length;
        const card=out.querySelector(`.clustercard [data-cl="${idx}"]`);
        const cc=card&&card.closest(".clustercard").querySelector(".cc");
        if(cc)cc.textContent=`👤 ${num(c.count)} photo(s)`;
        const btn=out.querySelector(`button[data-cl-open="${idx}"]`);
        if(btn)btn.textContent=`🔍 Preview all ${num(c.count)}`;
        toast("Removed from group — won't be filed here","info");
        return asItems();
      }});
  });
  $("#clusterMerge").onclick=mergeClusters;
  $("#clusterCancel").onclick=()=>{out.innerHTML="";};
  $("#clusterApply").onclick=applyClusters;
}
function mergeClusters(){
  const sel=[...S.clusterSel].sort((a,b)=>a-b);
  if(sel.length<2){toast("Select at least two people to merge","bad");return;}
  const base=S.clusters[sel[0]];
  const name=sel.map(i=>(S.clusters[i].name||"").trim()).find(x=>x)||"";
  for(let k=1;k<sel.length;k++)base.members=base.members.concat(S.clusters[sel[k]].members);
  base.count=base.members.length;base.name=name;
  const drop=new Set(sel.slice(1));
  S.clusters=S.clusters.filter((c,i)=>!drop.has(i));
  toast("Merged into one person","good");
  renderClusters(S.clusters);
}
async function applyClusters(e){
  const assignments=[];
  (S.clusters||[]).forEach(c=>{
    const name=(c.name||"").trim();if(!name)return;
    const folder=name.replace(/[^A-Za-z0-9 _-]/g,"").trim().replace(/ /g,"_")||"Person";
    c.members.forEach(pth=>assignments.push({path:pth,category:folder}));
  });
  if(!assignments.length){toast("Name at least one group first","bad");return;}
  const btn=e.target;busy(btn,true,"Filing…");
  const out=$("#applyOut");$("#clusterCancel")&&$("#clusterCancel").remove();
  try{
    const d=await runApplyJob("categorize/apply/start",{backend:S.backend,root:S.root,assignments},out);
    renderApplyResult(out,d);btn.remove();
    toast(d.cancelled?"Stopped":"Groups filed",d.cancelled?"info":"good");
    api("scan",{backend:S.backend,root:S.root,adb:S.adb,device:S.device,depth:S.depth})
      .then(sc=>S.scan=sc).catch(()=>{});
  }catch(err){toast(err.message,"bad");busy(btn,false);}
}

          <div class="btn-row" style="margin-top:0">

          </div>

    </div>
    <div class="card" style="margin-top:14px">
      <h4 class="cardh">2 · Options</h4>
      <div class="opts">
        <label class="toggle"><input type="checkbox" id="ffRec" checked/>
          <span class="tk"></span><span>Include sub-folders<span class="desc"> — scan the whole event tree</span></span></label>
      </div>
      <div class="slider" style="margin-top:8px">
        <label><span>🎯 Match strictness</span><span id="ffStrictVal">Balanced</span></label>
        <input type="range" id="ffStrict" min="30" max="52" step="1" value="40"/>
        <div class="ends"><span>Looser — more photos</span><span>Stricter — only sure matches</span></div>
      </div>
    </div>
    <div class="btn-row"><button class="btn" id="ffFind">🔎 Find their photos</button></div>
    <div id="ffProgress"></div><div id="ffOut"></div>`;
  $("#ffName").oninput=e=>S.ffName=e.target.value;
  $("#ffStrict").oninput=e=>{$("#ffStrictVal").textContent=ffStrictLabel(+e.target.value);};
  $("#ffStrictVal").textContent=ffStrictLabel(40);
  $("#ffPick").onclick=()=>$("#ffFile").click();
  $("#ffFile").onchange=e=>{const f=e.target.files[0];if(f)useSelfieFile(f);};
  $("#ffCam").onclick=openSelfieCamera;
  $("#ffFind").onclick=runFaceFind;
  const prev=$("#ffPrev");
  prev.ondragover=e=>{e.preventDefault();e.stopPropagation();prev.classList.add("drag");};
  prev.ondragleave=()=>prev.classList.remove("drag");
  prev.ondrop=e=>{e.preventDefault();e.stopPropagation();prev.classList.remove("drag");
    const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)useSelfieFile(f);};
}
function ffStrictLabel(v){return v<=36?"Looser":v>=46?"Strict":"Balanced";}
async function useSelfieFile(f){
  if(f.path){setSelfie(f.path);return;}
  const rd=new FileReader();
  rd.onload=async()=>{
    try{const d=await api("facefind/selfie",{data:rd.result});setSelfie(d.path);}
    catch(err){toast(err.message,"bad");}
  };
  rd.readAsDataURL(f);
}
function setSelfie(path){
  S.ffSelfie=path;
  const prev=$("#ffPrev");if(prev)prev.innerHTML=`<img src="/api/thumb?size=200&path=${encodeURIComponent(path)}&t=${Date.now()}"/>`;
  toast("Selfie added","good");
}
async function openSelfieCamera(){
  const host=$("#modalHost");
  host.innerHTML=`<div class="overlay"><div class="modal" style="max-width:460px">
    <div class="mh"><h3>📷 Take a selfie</h3><button class="x" id="camX">×</button></div>
    <div class="mb" style="padding:16px 18px;text-align:center">
      <video id="camV" autoplay playsinline style="width:100%;border-radius:12px;background:#000"></video>
      <canvas id="camC" style="display:none"></canvas>
    </div>
    <div class="mf"><span></span><div class="row">
      <button class="btn ghost sm" id="camCancel">Cancel</button>
      <button class="btn sm" id="camSnap">📸 Capture</button></div></div>
  </div></div>`;
  let stream;
  const close=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());host.innerHTML="";};
  $("#camX").onclick=close;$("#camCancel").onclick=close;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});$("#camV").srcObject=stream;}
  catch(err){toast("Couldn't open the camera — use “Choose photo” instead.","bad");close();return;}
  $("#camSnap").onclick=async()=>{
    const v=$("#camV"),c=$("#camC");c.width=v.videoWidth;c.height=v.videoHeight;
    c.getContext("2d").drawImage(v,0,0);
    const data=c.toDataURL("image/png");close();
    try{const d=await api("facefind/selfie",{data});setSelfie(d.path);}
    catch(err){toast(err.message,"bad");}

async function runFaceFind(e){
  if(!S.ffSelfie){toast("Add a selfie first","bad");return;}
  const btn=e.target;busy(btn,true,"Scanning faces…");
  const prog=$("#ffProgress");$("#ffOut").innerHTML="";
  try{
    const d=await api("facefind/start",{backend:S.backend,root:S.root,selfie:S.ffSelfie,
      recursive:$("#ffRec").checked,threshold:(+$("#ffStrict").value)/100});
    S.ffJob=d.jobId;
    prog.innerHTML=`<div class="preview" style="margin-top:14px"><div class="ph">
      <div class="chips" id="ffTally"><span class="chip">Starting…</span></div>
      <button class="btn ghost sm" id="ffCancel">Stop</button></div>
      <div style="padding:14px 18px"><div class="track" style="display:block;height:14px;border-radius:8px;background:#0d1424;border:1px solid #23324e;overflow:hidden">
        <div id="ffBar" class="fill" style="display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2))"></div></div>
        <div id="ffCount" style="color:var(--mut);font-size:12px;margin-top:8px">Preparing…</div></div></div>`;
    $("#ffCancel").onclick=()=>{if(S.ffJob)api("cluster/cancel",{jobId:S.ffJob});};
    pollFaceFind(btn);
  }catch(err){toast(err.message,"bad");busy(btn,false);}
}
async function pollFaceFind(btn){
  let d;try{d=await api("cluster/progress",{jobId:S.ffJob});}
  catch(err){toast(err.message,"bad");busy(btn,false);return;}
  const bar=$("#ffBar"),pc=$("#ffCount"),tally=$("#ffTally");
  if(d.phase==="downloading"){
    const mt=d.model_total||0,md=d.model_done||0,mp=mt?Math.round(md/mt*100):0;
    if(bar)bar.style.width=mp+"%";if(pc)pc.textContent=`Downloading face model ${mp}% (one-time)…`;
    if(tally)tally.innerHTML=`<span class="chip">Setting up AI…</span>`;
  }else{
    const total=d.total||0,done=d.done||0,pct=total?Math.round(done/total*100):0;
    if(bar)bar.style.width=pct+"%";
    if(pc)pc.textContent=total?`Checked ${num(done)} of ${num(total)} photos (${pct}%)`:"Scanning…";
    if(tally)tally.innerHTML=`<span class="chip">🙂 ${num(d.clusters||0)} match(es) so far</span>`;
  }
  if(d.error){$("#ffProgress").innerHTML=`<div class="callout bad" style="margin-top:14px">${esc(d.error)}</div>`;busy(btn,false);return;}
  if(!d.finished){setTimeout(()=>pollFaceFind(btn),700);return;}
  busy(btn,false);$("#ffProgress").innerHTML="";
  const res=d.result||{};
  if(res.error==="no_face_in_selfie"){$("#ffOut").innerHTML=`<div class="callout warn" style="margin-top:14px">😕 No face found in the selfie. Try a clearer, front-facing photo.</div>`;return;}
  renderFaceFindResults(res);
}
function renderFaceFindResults(res){
  const out=$("#ffOut");
  const matches=(res.matches||[]).slice();
  if(!matches.length){out.innerHTML=`<div class="callout info" style="margin-top:14px">No photos matched ${esc(S.ffName||"this person")}. Try a looser strictness or a clearer selfie.</div>`;return;}
  S.ffMatches=matches;
  out.innerHTML=`<div class="callout safe" style="margin-top:14px">✅ Found <b>${num(matches.length)}</b> photo(s) with
    ${esc(S.ffName||"this person")} (of ${num(res.scanned||0)} scanned). Untick any that aren't them, then save the album.</div>
    <div class="thumbgrid" id="ffGrid"></div>
    <div class="btn-row">
      <button class="btn warn" id="ffSave">💾 Save album (${num(matches.length)} copies)</button>
    </div><div id="ffSaveOut"></div>`;
  drawFaceFindGrid();
  $("#ffSave").onclick=saveFaceFindAlbum;
}
function drawFaceFindGrid(){
  const grid=$("#ffGrid");if(!grid)return;
  grid.innerHTML=S.ffMatches.map((mm,i)=>`<div class="thumb ${mm.drop?'':'sel'}" data-ffi="${i}" style="cursor:pointer" title="${esc(mm.path)} · ${Math.round(mm.score*100)}% match">
    <img loading="lazy" src="/api/thumb?size=300&path=${encodeURIComponent(mm.path)}" alt=""/>
    <div class="nm">${mm.drop?"— skipped —":Math.round(mm.score*100)+"% match"}</div></div>`).join("");
  grid.querySelectorAll("[data-ffi]").forEach(t=>t.onclick=()=>{
    const i=+t.dataset.ffi;S.ffMatches[i].drop=!S.ffMatches[i].drop;drawFaceFindGrid();
    const keep=S.ffMatches.filter(x=>!x.drop).length;
    const b=$("#ffSave");if(b){b.innerHTML=`💾 Save album (${num(keep)} copies)`;b.disabled=!keep;}});
}
async function saveFaceFindAlbum(e){
  const keep=S.ffMatches.filter(m=>!m.drop);
  if(!keep.length){toast("Nothing selected","bad");return;}
  const nm=(S.ffName||"Guest").trim();
  const safe=nm.replace(/[^A-Za-z0-9 _-]/g,"").trim().replace(/\s+/g,"_")||"Guest";
  const folder="FaceFind_"+safe;
  const assignments=keep.map(m=>({path:m.path,category:folder}));
  const btn=e.target;busy(btn,true,"Saving album…");
  const out=$("#ffSaveOut");
  try{
    const d=await runApplyJob("categorize/apply/start",
      {backend:S.backend,root:S.root,assignments,copy:true,_verb:"Copied"},out);
    const album=(S.root.replace(/[\\/]+$/,""))+"\\"+folder;
    out.innerHTML=`<div class="callout safe" style="margin-top:12px">✅ Saved <b>${num(d.copied||d.applied)}</b> photo(s) into
      <code>${esc(folder)}</code> (originals untouched). Share that folder with ${esc(nm)} — zip it, or send via WhatsApp/email.
      <div class="btn-row" style="margin-top:8px"><button class="btn ghost sm" id="ffOpen">📂 Open album folder</button></div></div>`;
    $("#ffOpen").onclick=()=>api("open",{path:album}).catch(()=>toast("Couldn't open folder","bad"));
    toast("Album saved","good");
    api("scan",{backend:S.backend,root:S.root,adb:S.adb,device:S.device,depth:S.depth}).then(sc=>S.scan=sc).catch(()=>{});
  }catch(err){toast(err.message,"bad");busy(btn,false);}
}

function pageCompress(m){
  const p=el("div","page");
  p.innerHTML=`
    <h1>Compress images <span style="font-size:14px;color:var(--mut);font-weight:400">· lossless &amp; smart</span></h1>
    <p class="lead">Shrink your photos <b>without any quality loss</b> — pixels stay
      bit-for-bit identical. JPEGs are slimmed by stripping bulky metadata &amp; embedded
      thumbnails; PNGs are re-packed losslessly.</p>
    <div class="card" id="cmpCard"><div class="empty"><span class="spin"></span> Checking…</div></div>`;
  m.appendChild(p);
  renderCompress();
}
async function renderCompress(){
  const card=$("#cmpCard");
  if(S.backend!=="local"){
    card.innerHTML=`<div class="callout warn">🗜️ Compression works on a local folder. If your photos
      are on a phone, copy them to your PC first (the Photo AI tab has a one-click copy).</div>`;return;}
  let st;try{st=await api("compress/status",{});}catch(err){card.innerHTML=`<div class="callout bad">${esc(err.message)}</div>`;return;}
  if(!st.available){
    card.innerHTML=`<div class="callout warn">🧩 Compression needs the <code>Pillow</code> package.
      Run phorg from source and click “Install AI support”, or <code>pip install pillow</code>.</div>`;return;}
  let bk={exists:false};try{bk=await api("compress/backup-status",{backend:S.backend,root:S.root});}catch(e){}
  card.innerHTML=`
    <div class="callout safe">✅ <div><b>Lossless by default.</b> Only non-picture bytes are removed —
      every pixel is preserved exactly. Originals are kept in <code>Originals_Backup/</code> (or you can
      save copies), so nothing is ever lost.</div></div>
    <div class="sect-t">Options</div>
    <div class="opts">
      <label class="toggle"><input type="checkbox" id="cmpRec" checked/>
        <span class="tk"></span><span>Include sub-folders<span class="desc"> — compress the whole tree</span></span></label>
      ${st.heic?`<label class="toggle"><input type="checkbox" id="cmpHeic" checked/>
        <span class="tk"></span><span>Convert HEIC → JPG<span class="desc"> — iPhone photos, universally viewable</span></span></label>`:""}
    </div>
    <label class="fld" style="margin-top:8px">Compression level</label>
    <select id="cmpLossy">
      <option value="0">Lossless — zero quality change (recommended)</option>
      <option value="1">Smaller — re-encode &amp; optionally resize (changes quality)</option>
    </select>
    <div id="cmpLossyOpts" style="display:none;margin-top:10px">
      <label class="fld">Image quality — <b id="cmpQVal">85%</b> <span style="color:var(--mut)">(higher = better looking, bigger file)</span></label>
      <input type="range" id="cmpQ" min="40" max="100" value="85" style="width:100%"/>
      <div style="display:flex;justify-content:space-between;color:var(--mut2);font-size:11px;margin-top:2px">
        <span>40% · smallest</span><span>70%</span><span>100% · best</span></div>
      <div id="cmpQEst" style="color:var(--mut);font-size:12.5px;margin-top:8px"></div>
      <div class="callout warn" style="margin-top:8px">⚠️ This re-encodes images — quality changes slightly. Originals are still backed up.</div>
    </div>
    <label class="fld" style="margin-top:10px">What to do with the smaller files</label>
    <select id="cmpMode">
      <option value="replace">Replace originals (keep originals in Originals_Backup/)</option>
      <option value="copy">Keep originals, save smaller copies in Compressed_Images/</option>
    </select>
    <div class="btn-row">
      <button class="btn ghost" id="cmpEst">📊 Estimate savings</button>
      <button class="btn" id="cmpRun">🗜️ Compress images</button>
      <button class="btn ghost" id="cmpPhash">🔎 Find near-duplicates</button>
    </div>
    ${bk.exists?`<div class="callout info" style="margin-top:12px">🗂️ <div>You have an <code>Originals_Backup/</code> with
      <b>${num(bk.count)}</b> file(s) (${fmtKb(bk.kb)}).
      <div class="btn-row" style="margin-top:8px">
        <button class="btn ghost sm" id="cmpRestore">↩️ Restore originals</button>
        <button class="btn ghost sm" id="cmpClear">🗑️ Delete backup (free ${fmtKb(bk.kb)})</button>
      </div></div></div>`:""}
    <div id="cmpOut"></div>`;
  $("#cmpLossy").onchange=e=>{const on=e.target.value==="1";$("#cmpLossyOpts").style.display=on?"block":"none";if(on)liveQualityEstimate();};
  if($("#cmpQ")){
    $("#cmpQ").oninput=e=>{$("#cmpQVal").textContent=e.target.value+"%";
      $("#cmpQEst").innerHTML=`<span style="color:var(--mut2)">move to see the new folder size…</span>`;};
    $("#cmpQ").onchange=liveQualityEstimate;
  }
  $("#cmpEst").onclick=estimateCompress;
  $("#cmpRun").onclick=runCompress;
  $("#cmpPhash").onclick=findNearDupes;
  if($("#cmpRestore"))$("#cmpRestore").onclick=async e=>{
    if(!confirm("Move every file in Originals_Backup/ back into place, replacing the compressed versions?"))return;
    busy(e.target,true,"Restoring…");
    try{const r=await api("compress/restore",{backend:S.backend,root:S.root});
      toast(`Restored ${num(r.restored)} original(s)`,"good");renderCompress();
      api("scan",{backend:S.backend,root:S.root,depth:S.depth}).then(sc=>S.scan=sc).catch(()=>{});
    }catch(err){toast(err.message,"bad");busy(e.target,false);}};

      toast(`Freed ${fmtKb(r.freedKb)}`,"good");renderCompress();

function _cmpBody(){
  return {backend:S.backend,root:S.root,recursive:$("#cmpRec").checked,
    mode:$("#cmpMode").value,lossy:$("#cmpLossy").value==="1",
    quality:$("#cmpQ")?+$("#cmpQ").value:85,max_edge:0,
    heic:$("#cmpHeic")?$("#cmpHeic").checked:false,
    include_hidden:S.include_hidden,protect:S.protect};
}
let _cmpEstToken=0;
async function liveQualityEstimate(){
  const box=$("#cmpQEst");if(!box)return;
  const q=$("#cmpQ")?$("#cmpQ").value:85;
  box.innerHTML=`<span class="spin"></span> Estimating size at ${q}%…`;
  const tok=++_cmpEstToken;
  try{
    const d=await api("compress/estimate",{..._cmpBody(),sample:8});
    if(tok!==_cmpEstToken)return;               // a newer slide superseded this
    const pct=d.beforeKb?Math.round(d.savedKb/d.beforeKb*100):0;
    const approx=d.sampled?"~":"";
    box.innerHTML=d.compressed
      ?`📉 At <b>${q}%</b>: this folder's images would go <b>${fmtKb(d.beforeKb)} → ${approx}${fmtKb(d.beforeKb-d.savedKb)}</b>
         (save ${approx}${fmtKb(d.savedKb)}, ${pct}% smaller).`
      :`Already small — little to save at ${q}%.`;
  }catch(err){if(tok===_cmpEstToken)box.innerHTML=`<span style="color:var(--bad)">${esc(err.message)}</span>`;}
}
async function estimateCompress(e){
  const btn=e.target;busy(btn,true,"Estimating…");
  try{
    const d=await api("compress/estimate",{..._cmpBody(),sample:24});
    const pct=d.beforeKb?Math.round(d.savedKb/d.beforeKb*100):0;
    const approx=d.sampled?"about ":"";
    $("#cmpOut").innerHTML=d.compressed
      ?`<div class="callout info" style="margin-top:12px">📊 Of <b>${num(d.candidates)}</b> image(s),
         roughly <b>${num(d.compressed)}</b> can shrink — ${approx}<b>${fmtKb(d.savedKb)}</b> saved (~${pct}% smaller,
         ${fmtKb(d.beforeKb)} → ${fmtKb(d.beforeKb-d.savedKb)}). Press <b>Compress images</b> to apply.</div>`
      :`<div class="callout safe" style="margin-top:12px">👍 Already optimal — no meaningful savings from ${num(d.candidates)} image(s).</div>`;
  }catch(err){toast(err.message,"bad");}finally{busy(btn,false);}
}
async function runCompress(e){
  const btn=e.target;busy(btn,true,"Compressing…");
  const out=$("#cmpOut");
  const body=_cmpBody();body._verb="Compressed";
  try{
    const d=await runApplyJob("compress/start",body,out);
    renderCompressResult(out,d);btn.remove();
    toast(d.cancelled?"Stopped":`Saved ${fmtKb(d.savedKb)}`,d.cancelled?"info":"good");
    api("scan",{backend:S.backend,root:S.root,adb:S.adb,device:S.device,depth:S.depth}).then(sc=>S.scan=sc).catch(()=>{});
  }catch(err){toast(err.message,"bad");busy(btn,false);}
}
async function findNearDupes(e){
  const btn=e.target;busy(btn,true,"Scanning…");
  const out=$("#cmpOut");
  try{
    const d=await runApplyJob("phash/start",{backend:S.backend,root:S.root,
      recursive:$("#cmpRec").checked,_verb:"Scanned"},out);
    if(!d.groups.length){out.innerHTML=`<div class="callout safe" style="margin-top:12px">✅ No visually near-identical images found.</div>`;busy(btn,false);return;}
    S._dupeGroups=d.groups.map(g=>({...g}));
    out.innerHTML=`<div class="callout info" style="margin-top:12px">🔎 Found <b>${num(d.count)}</b> set(s) of look-alike images
      (~${fmtKb(d.wastedKb)} in extras). <button class="btn ghost sm" id="phReview">Review &amp; keep one each →</button></div>`;
    $("#phReview").onclick=()=>openDupeReviewFrom(d.groups,"Near-duplicate review");
    busy(btn,false);
  }catch(err){toast(err.message,"bad");busy(btn,false);}
}
function renderCompressResult(host,d){
  if(!d.compressed){
    host.innerHTML=`<div class="callout info" style="margin-top:14px">👍 Nothing to shrink — your images are already as small as they can be (${num(d.skipped)} checked).</div>`;
    return;}
  const pct=d.beforeKb?Math.round(d.savedKb/d.beforeKb*100):0;
  let box=`<div class="callout safe" style="margin-top:14px">✅ Compressed <b>${num(d.compressed)}</b> image(s)
    ${d.lossy?"":"losslessly "}— saved <b>${fmtKb(d.savedKb)}</b> (${pct}% smaller: ${fmtKb(d.beforeKb)} → ${fmtKb(d.afterKb)}).
    ${d.skipped?`<br><span style="color:var(--mut)">${num(d.skipped)} already optimal, left untouched.</span>`:""}</div>`;
  box+=`<div class="callout info" style="margin-top:10px">${d.mode==="copy"
    ?`Smaller copies are in <code>Compressed_Images/</code>; your originals are untouched.`
    :`Originals were moved to <code>Originals_Backup/</code> — restore or delete them from this tab anytime.`}</div>`;
  if(d.items&&d.items.length){
    box+=`<div class="card" style="margin-top:12px"><div style="color:var(--mut);font-size:12px;margin-bottom:6px">Examples</div>
      ${d.items.map(it=>`<div class="histrow"><span class="hl">${esc(it.name)}${it.converted?" → .jpg":""}</span>
        <span style="color:var(--mut)">${fmtKb(it.from_kb)} → ${fmtKb(it.to_kb)} · −${it.pct}%</span></div>`).join("")}</div>`;
  }
  box+=undoBar(d.undo);
  host.innerHTML=box;wireUndo(host,d.undo);
}

  };
}
