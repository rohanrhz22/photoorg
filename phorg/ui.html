// ---------------------------------------------------------------- treemap
const TM_PALETTE=["#4f8cff","#7c5cff","#22c55e","#f59e0b","#ef4444","#06b6d4",
  "#ec4899","#14b8a6","#a855f7","#f97316","#3b82f6","#64748b"];
function treemapLayout(items,x,y,w,h,horiz,out){
  if(!items.length)return;
  if(items.length===1){out.push({...items[0],x,y,w,h});return;}
  const total=items.reduce((s,it)=>s+it.value,0)||1;
  let acc=0,i=0;
  while(i<items.length-1 && acc+items[i].value<total/2){acc+=items[i].value;i++;}
  const left=items.slice(0,i+1),right=items.slice(i+1);
  const lv=left.reduce((s,it)=>s+it.value,0);
  if(horiz){const lw=w*lv/total;
    treemapLayout(left,x,y,lw,h,!horiz,out);
    treemapLayout(right,x+lw,y,w-lw,h,!horiz,out);}
  else{const lh=h*lv/total;
    treemapLayout(left,x,y,w,lh,!horiz,out);
    treemapLayout(right,x,y+lh,w,h-lh,!horiz,out);}
}
function renderTreemap(el,tree){
  el._root=tree;el._stack=[];
  drawTreemap(el);
}
function currentTmNodes(el){
  let nodes=el._root||[];
  for(const seg of el._stack){
    const found=(nodes||[]).find(n=>n.name===seg);
    nodes=found?(found.children||[]):[];
  }
  return nodes;
}
function drawTreemap(el){
  const nodes=currentTmNodes(el);
  const top=nodes.filter(t=>(+t.kb||0)>0).sort((a,b)=>b.kb-a.kb);
  const crumb=`<div class="tmcrumb"><span class="tmc" data-tmi="-1">🏠 ${esc(S.root.split(/[\\/]/).pop()||"root")}</span>`+
    el._stack.map((s,i)=>` › <span class="tmc" data-tmi="${i}">${esc(s)}</span>`).join("")+`</div>`;
  if(!top.length){el.innerHTML=crumb+`<div class="empty" style="padding:24px">No sizeable sub-folders here.</div>`;
    wireTmCrumb(el);return;}
  const shown=top.slice(0,15).map((t,i)=>({name:t.name,value:t.kb,files:t.files,
    kids:(t.children||[]).length,color:TM_PALETTE[i%TM_PALETTE.length]}));
  const restKb=top.slice(15).reduce((s,t)=>s+t.kb,0);
  if(restKb>0)shown.push({name:"…other",value:restKb,files:0,kids:0,color:"#475569"});
  const rects=[];treemapLayout(shown,0,0,100,100,true,rects);
  el.innerHTML=crumb+`<div class="tmbox">`+rects.map(r=>{
    const big=r.w>14&&r.h>12;
    return `<div class="tcell${r.kids?' drill':''}" data-tmname="${esc(r.name)}"
      style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%;background:${r.color}"
      title="${esc(r.name)} — ${fmtKb(r.value)}${r.files?', '+num(r.files)+' files':''}${r.kids?' · click to zoom in':''}">
      ${big?`<b>${esc(r.name)}${r.kids?' ›':''}</b><span>${fmtKb(r.value)}</span>`:""}</div>`;
  }).join("")+`</div>`;
  wireTmCrumb(el);
  el.querySelectorAll(".tcell.drill").forEach(c=>c.onclick=()=>{
    el._stack.push(c.dataset.tmname);drawTreemap(el);});
}
function wireTmCrumb(el){
  el.querySelectorAll("[data-tmi]").forEach(c=>c.onclick=()=>{
    const i=+c.dataset.tmi;el._stack=i<0?[]:el._stack.slice(0,i+1);drawTreemap(el);});
}

// Ctrl+K opens the command palette even from inside inputs
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();}
});
document.addEventListener("keydown",e=>{
  if($("#modalHost").firstChild)return;                 // a modal is open
  const tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select")return;
  if(e.ctrlKey||e.metaKey){
    const k=e.key.toLowerCase();
    if(k==="z"&&!e.shiftKey){e.preventDefault();quickUndo();}
    else if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();quickRedo();}
    return;
  }
  // A = select all photos in the review grid
  if((e.key==="a"||e.key==="A")&&S.page==="photos"&&S.photoItems.length){
    e.preventDefault();
    S.photoItems.forEach((_,i)=>S.photoSel.add(i));
    renderPhotoGrid(S.photoItems);return;
  }
  // Enter = run the primary action on the current tab
  if(e.key==="Enter"){
    const b=$("#previewBtn")||$("#photoApply")||$("#connectBtn");
    if(b&&!b.disabled){e.preventDefault();b.click();}
    return;
  }
  const map={"1":"connect","2":"dashboard","3":"organize","4":"photos","5":"wedding","6":"facefind","7":"compress","8":"report","9":"safety"};
  if(map[e.key]){const btn=[...document.querySelectorAll("#nav button")].find(b=>b.dataset.page===map[e.key]);
    if(btn&&!btn.disabled){e.preventDefault();go(map[e.key]);}}
});
// --- drag & drop a folder onto the window to connect (Electron/VS Code browser) ---
(function(){
  let dragDepth=0;
  const ov=()=>$("#dropOverlay");
  window.addEventListener("dragover",e=>{e.preventDefault();});
  window.addEventListener("dragenter",e=>{e.preventDefault();dragDepth++;
    const o=ov();if(o)o.classList.add("on");});
  window.addEventListener("dragleave",e=>{dragDepth=Math.max(0,dragDepth-1);
    if(!dragDepth){const o=ov();if(o)o.classList.remove("on");}});
  window.addEventListener("drop",e=>{
    e.preventDefault();dragDepth=0;const o=ov();if(o)o.classList.remove("on");
    const f=(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0])||null;
    const path=f&&f.path;                      // available in Electron/VS Code browser
    if(!path){toast("Drop couldn't read the folder path here — use 📂 Browse instead.","info");return;}
    // if a file was dropped, fall back to its parent folder
    let root=path;
    if(f.type||/\.[A-Za-z0-9]{1,6}$/.test(path.split(/[\\/]/).pop()||"")){
      root=path.replace(/[\\/][^\\/]*$/,"")||path;}
    S.backend="local";S.root=root;
    go("connect");
    const ri=$("#rootIn");if(ri)ri.value=root;
    doConnect();
  });
})();

    {label:"Go to Report",icon:"📄",need:1,run:()=>go("report")},
    {label:"Go to Safety",icon:"🛡️",run:()=>go("safety")},
    {label:"Undo last action",icon:"↩️",need:1,run:quickUndo},

  ];
  Object.entries(OPS).forEach(([k,o])=>cmds.push({label:"Organize · "+o.title,icon:o.icon,need:1,run:()=>{go("organize");setTimeout(()=>selectOp(k),60);}}));
  return cmds.filter(c=>!c.need||S.connected);
}
function openPalette(){
  const host=$("#modalHost");
  const all=paletteCommands();
  host.innerHTML=`<div class="overlay" id="palov"><div class="modal" style="max-width:520px">
    <div class="mh"><input type="text" id="palIn" placeholder="Type a command…  (e.g. compress, undo, organize)" style="border:0;background:transparent;font-size:15px"/>
      <button class="x" id="palX">×</button></div>
    <div class="mb" id="palList" style="max-height:52vh"></div>
  </div></div>`;
  let sel=0,filtered=all;
  const close=()=>{host.innerHTML="";};
  const draw=()=>{
    $("#palList").innerHTML=filtered.length?filtered.map((c,i)=>`<div class="fitem ${i===sel?'psel':''}" data-pi="${i}">
      <span class="fi">${c.icon}</span><span>${esc(c.label)}</span></div>`).join(""):`<div class="empty">No matching command.</div>`;
    $("#palList").querySelectorAll("[data-pi]").forEach(el=>el.onclick=()=>{const c=filtered[+el.dataset.pi];close();c.run();});
  };
  const filter=q=>{q=q.trim().toLowerCase();filtered=q?all.filter(c=>c.label.toLowerCase().includes(q)):all;sel=0;draw();};
  $("#palX").onclick=close;
  host.querySelector(".overlay").onclick=e=>{if(e.target===$("#palov"))close();};
  const inp=$("#palIn");
  inp.oninput=e=>filter(e.target.value);
  inp.onkeydown=e=>{
    if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(filtered.length-1,sel+1);draw();}
    else if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,sel-1);draw();}
    else if(e.key==="Enter"){e.preventDefault();const c=filtered[sel];if(c){close();c.run();}}
    else if(e.key==="Escape"){close();}
  };
  draw();inp.focus();
}

// ---------------------------------------------------------------- accent colour
const ACCENTS={blue:["#4f8cff","#7c5cff"],teal:["#14b8a6","#0ea5e9"],
  green:["#22c55e","#16a34a"],purple:["#a855f7","#7c3aed"],rose:["#f43f5e","#ec4899"],amber:["#f59e0b","#f97316"]};
function applyAccent(name){
  const a=ACCENTS[name]||ACCENTS.blue;
  document.documentElement.style.setProperty("--accent",a[0]);
  document.documentElement.style.setProperty("--accent2",a[1]);
}
function initAccent(){
  let a="blue";try{a=localStorage.getItem("phorg-accent")||"blue";}catch(e){}
  applyAccent(a);
}
