<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#F5F5F7"/>
<title>Hapzea — find every guest's photos</title>
<style>
/* ============================================================
   Hapzea design system — calm, precise, near-monochrome.
   One accent (bronze) shared with the guest keepsake page.
   Spacing on an 8px scale; type locked to 12/14/16/20/24/32.
   ============================================================ */
:root{
  --surface:#FFFFFF;            /* cards */
  --surface2:#F5F5F7;           /* page + wells */
  --txt:#1D1D1F;
  --mut:rgba(29,29,31,.62);     /* secondary = same ink, reduced presence */
  --mut2:rgba(29,29,31,.4);
  --hair:rgba(29,29,31,.1);     /* hairlines, never heavy borders */
  --accent:#A3803C;             /* the one accent — ties host to guest page */
  --accent-tint:rgba(163,128,60,.1);
  --ring:rgba(163,128,60,.28);
  --good:#3E7C4F; --warn:#9A6B1F; --bad:#B3402E;
  --good-bg:rgba(62,124,79,.08); --warn-bg:rgba(154,107,31,.08); --bad-bg:rgba(179,64,46,.08);
  /* a millimetre of elevation, no more */
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --shadow-2:0 2px 6px rgba(0,0,0,.06),0 12px 32px rgba(0,0,0,.07);
  --ease:cubic-bezier(.4,0,.2,1);
}
body.dark{
  --surface:#1C1C1E; --surface2:#000000;
  --txt:#F5F5F7; --mut:rgba(245,245,247,.62); --mut2:rgba(245,245,247,.4);
  --hair:rgba(245,245,247,.12);
  --accent:#C9A25E; --accent-tint:rgba(201,162,94,.14); --ring:rgba(201,162,94,.3);
  --good:#6FBF85; --warn:#D9A94F; --bad:#E07B6A;
  --good-bg:rgba(111,191,133,.1); --warn-bg:rgba(217,169,79,.1); --bad-bg:rgba(224,123,106,.1);
  --shadow:none; --shadow-2:none;   /* dark mode layers by surface, not shadow */
}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-behavior:smooth}
body{margin:0;color:var(--txt);background:var(--surface2);
  font:14px/1.55 -apple-system,'SF Pro Text',BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::selection{background:var(--accent-tint)}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}
svg{vertical-align:-3px}

/* layout — 720px column keeps the 3-step journey a single readable spine */
.main{padding:56px 32px 112px;max-width:920px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;margin:0 0 40px}
.brandlogo{height:28px;width:auto;object-fit:contain}
.brandname{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}
.page{animation:fadeIn .3s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:40px;line-height:1.08;margin:0 0 12px;font-weight:600;letter-spacing:-.03em}
.lead{color:var(--mut);margin:0 0 40px;font-size:16px;line-height:1.55;max-width:52ch}

/* step tracker — quiet wayfinding, never louder than the content it points to */
.steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 32px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;
  color:var(--mut2);cursor:pointer;user-select:none;background:none;border:0;
  padding:8px 0;transition:color .2s var(--ease)}
.step:hover{color:var(--txt)}
.step .sd{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:600;border:1px solid var(--hair);color:var(--mut);
  transition:all .25s var(--ease)}
.step.active{color:var(--txt)}
.step.active .sd{background:var(--accent);border-color:var(--accent);color:#fff}
.step.done{color:var(--mut)}
.step.done .sd{color:var(--accent);border-color:var(--ring)}
.step+.step::before{content:"";width:24px;height:1px;background:var(--hair);margin-right:8px}
@media(max-width:640px){.step .lbl{display:none}.step+.step::before{width:16px}}
.prewarm{margin-top:8px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:8px}
.prewarm:empty{display:none}

/* cards — hierarchy by elevation and spacing, not decoration */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:20px;
  padding:28px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.card.hero{box-shadow:var(--shadow-2)}   /* the QR card is the payoff — one step up */
body.dark .card.hero{border-color:rgba(245,245,247,.2)}

label.fld{display:block;margin:16px 0 8px;font-size:12px;color:var(--mut);font-weight:600;
  text-transform:uppercase;letter-spacing:.04em}
.optl{color:var(--mut2);font-weight:400;text-transform:none;letter-spacing:0}
input[type=text],select{width:100%;background:var(--surface2);border:1px solid var(--hair);
  color:var(--txt);border-radius:12px;padding:12px 16px;font-size:14px;font-family:inherit;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
input[type=text]::placeholder{color:var(--mut2)}
input[type=text]:focus,select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--ring)}
.row{display:flex;gap:8px;align-items:center}
.row input[type=text]{flex:1}

/* buttons — one filled per view; everything else tinted or text */
.btn{background:var(--accent);color:#fff;border:0;padding:12px 24px;border-radius:980px;
  font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;transition:opacity .2s var(--ease),transform .2s var(--ease)}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--accent-tint);color:var(--accent)}
.btn.ghost:hover{opacity:.82}
.btn.warn{background:var(--accent)}      /* save = the primary of its view */
.btn.sm{padding:8px 16px;font-size:13px;min-height:36px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}

/* toggles */
.toggle{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px;cursor:pointer}
.toggle input{display:none}
.tk{width:42px;height:24px;border-radius:20px;background:var(--hair);position:relative;
  transition:background .2s var(--ease);flex:none}
.tk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
  background:var(--surface);transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.tk{background:var(--accent)}
.toggle input:checked+.tk::after{transform:translateX(18px)}
.toggle .desc{color:var(--mut);font-size:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px;margin-top:8px}

/* progress surfaces */
.preview{margin-top:16px;border:1px solid var(--hair);border-radius:16px;overflow:hidden;
  background:var(--surface)}
.preview .ph{padding:16px;background:var(--surface2);display:flex;align-items:center;
  justify-content:space-between;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--hair);border-radius:980px;
  padding:4px 12px;font-size:12px;color:var(--mut)}
.chip b{color:var(--txt)}
.track{display:block;height:6px;border-radius:980px;background:var(--surface2);
  border:1px solid var(--hair);overflow:hidden}
.fill{display:block;height:100%;width:0%;background:var(--accent);
  transition:width .3s var(--ease)}

.callout{border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.55;
  background:var(--surface2);border:1px solid var(--hair);color:var(--txt)}
.callout.flex{display:flex;gap:8px;align-items:center}
.callout.safe{background:var(--good-bg);border-color:transparent;color:var(--good)}
.callout.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.callout.info{background:var(--accent-tint);border-color:transparent;color:var(--txt)}
.callout.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.callout code{background:var(--hair);padding:1px 6px;border-radius:6px;font-size:12px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:50}
.modal{width:min(560px,92vw);max-height:82vh;background:var(--surface);
  border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow-2);
  display:flex;flex-direction:column;overflow:hidden}
.modal .mh{padding:16px 24px;border-bottom:1px solid var(--hair);display:flex;
  justify-content:space-between;align-items:center}
.modal .mh h3{margin:0;font-size:16px;font-weight:600}
.modal .mb{padding:8px;overflow:auto}
.modal .mf{padding:16px 24px;border-top:1px solid var(--hair);display:flex;
  justify-content:space-between;gap:8px;align-items:center}
.crumbs{padding:8px 24px 0;color:var(--mut);font-size:12px;word-break:break-all}
.fitem{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:12px;
  cursor:pointer;transition:background .15s var(--ease)}
.fitem:hover{background:var(--surface2)}
.fitem .fi{color:var(--mut);display:flex}
.x{background:transparent;border:0;color:var(--mut);font-size:20px;line-height:1;
  padding:8px;border-radius:8px;min-width:36px;min-height:36px}
.x:hover{background:var(--surface2);color:var(--txt)}

/* toast */
#toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{min-width:240px;max-width:360px;padding:12px 16px;border-radius:12px;
  box-shadow:var(--shadow-2);font-size:13px;display:flex;gap:8px;align-items:flex-start;
  animation:slide .25s var(--ease);border:1px solid var(--hair);background:var(--surface)}
body.dark .toast{background:#2C2C2E}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--mut2);flex:none;margin-top:5px}
.tdot.good{background:var(--good)}.tdot.bad{background:var(--bad)}.tdot.info{background:var(--accent)}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

.spin{width:14px;height:14px;border:2px solid var(--hair);border-top-color:var(--accent);
  border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--mut);text-align:center;padding:40px 8px}
.sect-t{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:24px 0 8px;font-weight:600}
details.advbox{margin:8px 0 0}
details.advbox>summary{cursor:pointer;color:var(--mut);font-size:14px;margin:16px 0 8px;
  list-style:none;user-select:none;padding:8px 0}
details.advbox>summary:hover{color:var(--txt)}
details.advbox>summary::-webkit-details-marker{display:none}
details.advbox>summary::before{content:"› ";color:var(--accent)}
details.advbox[open]>summary::before{content:"⌄ "}
.cardh{margin:0 0 8px;font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.subhint{color:var(--mut);font-size:12px;margin-top:8px;line-height:1.55}

/* thumbnails */
.thumbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:8px;margin-top:8px}
.thumb{position:relative;background:var(--surface);border:1px solid var(--hair);border-radius:12px;
  padding:4px;cursor:pointer;user-select:none;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.thumb:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.thumb.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--ring)}
.thumb img{width:100%;height:92px;object-fit:cover;border-radius:8px;background:var(--surface2);display:block}
.thumb .nm{color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 4px 2px}

/* guest rows */
.histrow{display:flex;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--hair);font-size:14px}
.histrow:first-child{border-top:0}
.histrow .hl{flex:1} .histrow .ht{color:var(--mut2);font-size:12px}

/* sliders */
.slider{margin:16px 0}
.slider label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:8px}
.slider label b{color:var(--txt)}
.slider input[type=range]{width:100%;accent-color:var(--accent)}
.slider .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mut2);margin-top:2px}

/* drag-drop overlay */
#dropOverlay{position:fixed;inset:0;z-index:120;display:none;align-items:center;
  justify-content:center;background:rgba(0,0,0,.4)}
#dropOverlay.on{display:flex}
#dropOverlay .dropinner{border:2px dashed var(--accent);border-radius:16px;padding:48px 64px;
  text-align:center;color:var(--txt);font-size:16px;font-weight:600;background:var(--surface)}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--hair);border-radius:4px}

/* selfie gallery */
.selfies{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.selfie{position:relative;width:74px;height:74px;border-radius:12px;overflow:hidden;
  border:1px solid var(--hair);background:var(--surface2)}
.selfie img{width:100%;height:100%;object-fit:cover;display:block}
.selfie .rm{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;border:0;
  background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center;cursor:pointer}
.selfieadd{width:74px;height:74px;border-radius:12px;border:1px dashed var(--hair);
  background:var(--surface2);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:pointer;color:var(--mut);transition:border-color .2s var(--ease),color .2s var(--ease)}
.selfieadd:hover{border-color:var(--accent);color:var(--accent)}
.selfieadd span{font-size:11px;font-weight:600}

/* confidence bands — informational, so they stay quiet */
.band{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;
  padding:2px 8px;border-radius:980px;text-transform:uppercase}
.band.sure{background:var(--good-bg);color:var(--good)}
.band.likely{background:var(--accent-tint);color:var(--accent)}
.band.maybe{background:var(--warn-bg);color:var(--warn)}
.thumb .kp{position:absolute;top:8px;left:8px;width:20px;height:20px;accent-color:var(--accent);cursor:pointer;z-index:3}
.thumb .bd{position:absolute;bottom:26px;left:8px;z-index:2}
.thumb .zoom{position:absolute;top:8px;right:8px;z-index:3;width:24px;height:24px;border-radius:50%;
  border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;display:grid;place-items:center}

/* lightbox */
.lbov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;flex-direction:column;z-index:130}
.lbtop{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;gap:8px}
.lbtop .lbn{font-size:13px;color:#F5F5F7;opacity:.62;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbtop .x{color:#F5F5F7}
.lbmain{flex:1;display:flex;align-items:center;justify-content:center;gap:16px;padding:0 16px;min-height:0}
.lbmain img{max-width:84vw;max-height:78vh;object-fit:contain;border-radius:12px;background:#1C1C1E}
.lbnav{background:rgba(255,255,255,.12);border:0;color:#fff;width:44px;height:44px;
  border-radius:50%;font-size:20px;flex:none;cursor:pointer;transition:opacity .2s var(--ease)}
.lbnav:hover{opacity:.8}
.lbfoot{display:flex;gap:8px;justify-content:center;align-items:center;padding:16px 24px 24px;flex-wrap:wrap}
.lbfoot .chip{background:transparent;border-color:rgba(255,255,255,.24);color:#F5F5F7}

/* theme toggle */
.themebtn{position:fixed;top:16px;right:16px;z-index:40;background:var(--surface);
  border:1px solid var(--hair);color:var(--mut);border-radius:980px;padding:10px 16px;
  font-size:13px;min-height:40px;cursor:pointer;transition:color .2s var(--ease)}
.themebtn:hover{color:var(--txt)}

/* QR — always on white so every phone camera reads it */
.qrwrap{position:relative;display:inline-block}
.qrwrap .qrlogo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:44px;height:44px;border-radius:9px;background:#fff;padding:4px;box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* ============================================================
   Guest pages served from this computer (?g= / ?a=) wear the
   same warm stationery language as the cloud guest page, so a
   guest never feels a seam between the two.
   ============================================================ */
body.guest{--surface:#fffdf9;--surface2:#f6f1e7;--txt:#2a231b;
  --mut:rgba(42,35,27,.62);--mut2:rgba(42,35,27,.4);--hair:rgba(42,35,27,.12);
  --accent:#A3803C;--accent-tint:rgba(163,128,60,.12);--ring:rgba(163,128,60,.3);
  background:#f6f1e7}
body.guest h1{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:500}
body.guest .btn{background:#28211a;color:#f8f3e9}
body.guest .btn.ghost{background:transparent;border:1px solid #d5c7ac;color:#4a4133}
.gbrand{text-align:center;font-family:Georgia,'Times New Roman',serif;letter-spacing:.34em;
  font-size:12px;color:#8a6b30;margin:8px 0 24px}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#a3803c;
  margin:0 0 4px;font-weight:700}

/* accessibility */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* responsive rhythm */
@media(max-width:768px){.main{padding:32px 16px 64px}}
@media(max-width:640px){h1{font-size:24px}.lead{font-size:14px;margin-bottom:24px}
  .card{padding:16px;border-radius:12px}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="main" id="main"></main>

<div id="modalHost"></div>
<div id="dropOverlay"><div class="dropinner">Drop the folder to open it</div></div>
<div id="toasts"></div>

<script src="/qrcode.min.js"></script>
<script>
// ---------------------------------------------------------------- state
const S = {
  connected:false, backend:"local", root:"", depth:3,
  scan:null,
  ffSelfie:"", ffSelfies:[], ffName:"", ffMatches:[], ffJob:null,
  shareEvent:"", productionUrl:"",
  guestToken:null, guestEvent:"", guestSelfie:null, guestSelfies:[], guestUpload:null, gJob:null, gFails:0,
  shareEnabled:false,
};

// ---------------------------------------------------------------- helpers
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
// Thin-stroke inline icons (20px grid) — never emoji in interface chrome.
const IC={
  folder:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>',
  drive:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="8" rx="2"/><path d="M7.5 12h.01M11 12h.01"/></svg>',
  home:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5 12 4.5l7.5 6V19a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z"/></svg>',
  cam:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h2.8l1.6-2.3h7.2l1.6 2.3H20a.9.9 0 0 1 .9.9V18a.9.9 0 0 1-.9.9H4a.9.9 0 0 1-.9-.9V9.4a.9.9 0 0 1 .9-.9z"/><circle cx="12" cy="13.4" r="3.4"/></svg>',
  expand:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>',
};
function fmtKb(kb){kb=+kb||0;if(kb>=1048576)return (kb/1048576).toFixed(2)+" GB";
  if(kb>=1024)return (kb/1024).toFixed(1)+" MB";return kb+" KB";}
function num(n){return (+n||0).toLocaleString();}
// Render a scannable QR code into `host`. Works fully offline (vendored lib).
function renderQR(host,text,cell=5,margin=2,ec="M"){
  if(!host)return;
  if(typeof qrcode==="undefined"){host.innerHTML=`<div class="subhint">QR unavailable — use the link above.</div>`;return;}
  try{
    const q=qrcode(0,ec);q.addData(text);q.make();
    host.innerHTML=`<div class="qrwrap" style="display:inline-block;background:#fff;padding:10px;border-radius:12px">${q.createImgTag(cell,margin)}</div>`;

async function api(path,body){
  const r = await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body||{})});
  const data = await r.json().catch(()=>({error:"Bad response"}));
  if(!r.ok||data.error) throw new Error(data.error||("HTTP "+r.status));
  return data;
}
function toast(msg,kind="info",ms=3800){
  const host=$("#toasts");const t=el("div","toast "+kind);
  t.innerHTML=`<span class="tdot ${kind}"></span><span>${msg}</span>`;host.appendChild(t);
  setTimeout(()=>{t.style.opacity=0;t.style.transform="translateX(30px)";
    setTimeout(()=>t.remove(),250);},ms);
}
function busy(btn,on,label){
  if(!btn)return;
  if(on){
    if(!btn.dataset.busy){btn.dataset.orig=btn.innerHTML;btn.dataset.busy="1";}
    btn.disabled=true;
    btn.innerHTML=`<span class="spin"></span> ${label||"Working…"}`;}
  else{btn.disabled=false;
    if(btn.dataset.busy){btn.innerHTML=btn.dataset.orig||btn.innerHTML;
      delete btn.dataset.orig;delete btn.dataset.busy;}}
}

// Warm the face cache in the background so the first search is instant.
async function startPrewarm(){
  if(S.backend!=="local"||!S.root)return;
  let r;try{r=await api("facefind/prewarm",{backend:"local",root:S.root});}catch(e){return;}
  if(!r||!r.ok||!r.jobId)return;
  S.prewarmJob=r.jobId;
  pollPrewarm(S.root);
}
async function pollPrewarm(forRoot){
  const wrap=$("#prewarm");
  if(!wrap||S.root!==forRoot)return;
  let d;try{d=await api("cluster/progress",{jobId:S.prewarmJob});}catch(e){wrap.innerHTML="";return;}
  if(d.phase==="downloading"){wrap.innerHTML=`<span class="spin"></span> Preparing face matching…`;}
  else if(d.finished){
    wrap.innerHTML=d.error?"":`Ready — guest searches will be instant.`;
    if(!d.error)setTimeout(()=>{const w=$("#prewarm");if(w&&S.root===forRoot)w.innerHTML="";},5000);
    return;
  }else{
    const t=d.total||0,dn=d.done||0,pct=t?Math.round(dn/t*100):0;
    wrap.innerHTML=`<span class="spin"></span> Getting photos ready for instant search… ${pct}%`;
  }
  setTimeout(()=>pollPrewarm(forRoot),900);
}

let GUEST_OPEN=new Set();   // job ids whose photo preview is expanded
function renderGuestList(d){
  const list=$("#guestList");if(!list)return;
  const cn=$("#guestCount");if(cn)cn.textContent=d.count?`(${num(d.count)})`:"";
  if(!(d.guests&&d.guests.length)){
    list.innerHTML=`<div class="subhint">No one yet.</div>`;return;}
  list.innerHTML=d.guests.map(g=>{
    const time=esc(new Date(g.ts*1000).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}));
    const canPrev=g.done&&g.count>0&&g.matches&&g.matches.length;
    const open=canPrev&&GUEST_OPEN.has(g.job);
    let right;
    if(!g.done)right="<span class='spin'></span> searching";
    else if(g.count==null)right="—";
    else right=`${num(g.count)} photo(s)${g.scanned?` <span style="opacity:.7">/ ${num(g.scanned)} scanned</span>`:""}`;
    const prevBtn=canPrev?`<button class="btn ghost sm gPrevBtn" data-job="${esc(g.job)}">${open?"Hide":"Preview"}</button>`:"";
    const grid=open?`<div class="thumbgrid" style="margin-top:10px">${g.matches.map(p=>`<a class="thumb" href="/api/download?path=${encodeURIComponent(p)}" download>
      <img loading="lazy" src="/api/thumb?size=300&path=${encodeURIComponent(p)}" alt=""/><div class="nm">Download</div></a>`).join("")}</div>`:"";
    let deliver="";
    if(g.contact){
      const ok=g.notified==="sent";
      const tried=g.done&&g.count>0;
      const badge=ok?`<span style="color:var(--good)">· sent</span>`
        :(tried?`<span style="color:var(--warn)" title="${esc(g.notified||"")}">· not sent yet</span>`:"");
      deliver=`<div class="ht" style="margin-top:3px">${esc(g.contact)} ${badge}</div>`;
    }
    return `<div class="histrow" style="display:block">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <span class="hl"><b>${esc(g.name)}</b> <span class="ht">· ${time}</span></span>
        <span style="color:var(--mut);display:flex;gap:10px;align-items:center">${right}${prevBtn}</span>
      </div>${deliver}${grid}</div>`;
  }).join("");
  list.querySelectorAll(".gPrevBtn").forEach(b=>b.onclick=()=>{
    const j=b.dataset.job;GUEST_OPEN.has(j)?GUEST_OPEN.delete(j):GUEST_OPEN.add(j);
    renderGuestList(d);});
}

// -- open the phone's native camera (fallback when live camera is blocked) ---
function openNativeCamera(cb){
  const inp=document.createElement("input");
  inp.type="file";
  inp.accept="image/*";
  inp.capture="user";                       // property form
  inp.setAttribute("capture","user");       // attribute form (Android needs this)
  inp.style.position="fixed";inp.style.left="-9999px";
  document.body.appendChild(inp);           // must be in the DOM for capture
  inp.onchange=e=>{const f=e.target.files&&e.target.files[0];
    try{document.body.removeChild(inp);}catch(_){}
    if(f)cb(f);};
  inp.click();
}

async function guestPoll(btn){
  let d;
  try{d=await api("cluster/progress",{jobId:S.gJob});S.gFails=0;}
  catch(err){
    // The phone reaches the host only while its app is open. A failed poll is
    // usually a brief network blip — retry a few times — but repeated failures
    // (or a lost job after a restart) mean the host went offline: say so and
    // stop, instead of leaving a frozen "Finding…" spinner on screen.
    S.gFails=(S.gFails||0)+1;
    if(S.gFails<4){setTimeout(()=>guestPoll(btn),1500);return;}
    busy(btn,false);
    $("#gProgress").innerHTML=`<div class="callout warn" style="margin-top:14px">⚠️ Lost connection to the host. The photo app was probably closed or sharing was stopped. Please try again when the host is back online.</div>`;
    return;
  }
  const bar=$("#gBar"),pc=$("#gCount"),tally=$("#gTally");
  if(d.phase==="downloading"){const mt=d.model_total||0,md=d.model_done||0,mp=mt?Math.round(md/mt*100):0;
    if(bar)bar.style.width=mp+"%";if(pc)pc.textContent=`Getting ready ${mp}%…`;}
  else{const total=d.total||0,done=d.done||0,pct=total?Math.round(done/total*100):0;
    if(bar)bar.style.width=pct+"%";if(pc)pc.textContent=total?`Checked ${num(done)} of ${num(total)} (${pct}%)`:"Scanning…";
    if(tally)tally.innerHTML=`<span class="chip"><b>${num(d.clusters||0)}</b> so far</span>`;}
  if(d.error){$("#gProgress").innerHTML=`<div class="callout bad" style="margin-top:14px">${esc(d.error)}</div>`;busy(btn,false);return;}
  if(!d.finished){setTimeout(()=>guestPoll(btn),700);return;}
  busy(btn,false);$("#gProgress").innerHTML="";
  const res=d.result||{};
  if(res.error==="no_face_in_selfie"){$("#gOut").innerHTML=`<div class="callout warn" style="margin-top:14px">We couldn't see a face in that selfie. A straight-on photo in good light works best.</div>`;return;}
  const m=(res.matches||[]);
  if(!m.length){$("#gOut").innerHTML=`<div class="callout info" style="margin-top:14px">No photos found yet. Try a clearer selfie.</div>`;return;}
  $("#gOut").innerHTML=`<div class="callout safe" style="margin-top:14px">You appear in <b>${num(m.length)}</b> photograph${m.length>1?"s":""} — tap to download, or save them all.</div>
    <div class="btn-row"><a class="btn" href="/api/download/zip?job=${encodeURIComponent(S.gJob)}&token=${encodeURIComponent(S.guestToken)}" download>Download all (${num(m.length)})</a>
      <button class="btn ghost" id="gShare" style="display:none">Share this event</button></div>
    <div class="thumbgrid">${m.map((x,i)=>`<div class="thumb" data-gi="${i}">
      <button class="zoom" data-gz="${i}" aria-label="Zoom">${IC.expand}</button>
      <a href="/api/download?path=${encodeURIComponent(x.path)}" download>
        <img loading="lazy" src="/api/thumb?size=400&path=${encodeURIComponent(x.path)}" alt=""/>
        <div class="nm">Download</div></a></div>`).join("")}</div>`;
  const gs=$("#gShare");
  if(gs&&navigator.share){gs.style.display="";gs.onclick=()=>navigator.share(
    {title:S.guestEvent,text:"Find your photos from "+S.guestEvent,url:location.href}).catch(()=>{});}
  $("#gOut").querySelectorAll("[data-gz]").forEach(z=>z.onclick=e=>{e.preventDefault();e.stopPropagation();
    openLightbox(m,+z.dataset.gz);});
  if(S.gRid&&S.gAtoken){
    const link=location.origin+"/?a="+S.gRid+"."+S.gAtoken;
    $("#gOut").insertAdjacentHTML("beforeend",
      `<div class="callout info" style="margin-top:12px">Save your private album link — your photos will be waiting here:
        <div class="btn-row" style="margin-top:8px"><input id="gLink" readonly value="${esc(link)}" style="flex:1;min-width:0"/>
        <button class="btn ghost sm" id="gCopy">Copy</button></div></div>`);
    const cp=$("#gCopy");if(cp)cp.onclick=()=>{try{navigator.clipboard.writeText(link);toast("Link copied","good");}catch(e){const i=$("#gLink");if(i){i.select();document.execCommand("copy");toast("Link copied","good");}}};
  }
}

// confidence band from a cosine score
function confBand(score){
  if(score>=0.62)return{k:"sure",t:"Sure"};
  if(score>=0.50)return{k:"likely",t:"Likely"};
  return{k:"maybe",t:"Maybe"};
}
// full-size preview of a list of {path,score} at index i
function openLightbox(list,i){
  const host=$("#modalHost");let idx=i;
  const close=()=>{host.innerHTML="";document.removeEventListener("keydown",key);};
  const key=e=>{if(e.key==="Escape")close();else if(e.key==="ArrowLeft"){idx=(idx-1+list.length)%list.length;draw();}else if(e.key==="ArrowRight"){idx=(idx+1)%list.length;draw();}};
  const draw=()=>{
    const it=list[idx];const b=confBand(it.score||0);
    host.innerHTML=`<div class="lbov" id="lbov">
      <div class="lbtop"><span class="lbn">${esc((it.path||"").split(/[\\/]/).pop())}</span>
        <button class="x" id="lbX" aria-label="Close">×</button></div>
      <div class="lbmain">
        <button class="lbnav" id="lbPrev" aria-label="Previous">‹</button>
        <img src="/api/thumb?size=1400&path=${encodeURIComponent(it.path)}" alt=""/>
        <button class="lbnav" id="lbNext" aria-label="Next">›</button></div>
      <div class="lbfoot"><span class="band ${b.k}">${b.t}</span>
        <span class="chip">${Math.round((it.score||0)*100)}% match</span>
        <a class="btn sm" href="/api/download?path=${encodeURIComponent(it.path)}" download>Download</a></div>
    </div>`;
    $("#lbX").onclick=close;
    $("#lbov").onclick=e=>{if(e.target===$("#lbov"))close();};
    $("#lbPrev").onclick=()=>{idx=(idx-1+list.length)%list.length;draw();};
    $("#lbNext").onclick=()=>{idx=(idx+1)%list.length;draw();};
  };
  document.addEventListener("keydown",key);draw();
}

async function pollHapzea(btn){
  let d;try{d=await api("cluster/progress",{jobId:S.ffJob});}
  catch(err){toast(err.message,"bad");busy(btn,false);return;}
  const bar=$("#ffBar"),pc=$("#ffCount"),tally=$("#ffTally");
  if(d.phase==="downloading"){
    const mt=d.model_total||0,md=d.model_done||0,mp=mt?Math.round(md/mt*100):0;
    if(bar)bar.style.width=mp+"%";if(pc)pc.textContent=`Downloading face model ${mp}% (one-time)…`;
    if(tally)tally.innerHTML=`<span class="chip">Setting up AI…</span>`;
  }else{
    const total=d.total||0,done=d.done||0,pct=total?Math.round(done/total*100):0;
    if(bar)bar.style.width=pct+"%";
    if(pc)pc.textContent=total?`Checked ${num(done)} of ${num(total)} photos (${pct}%)`:"Scanning…";
    if(tally)tally.innerHTML=`<span class="chip"><b>${num(d.clusters||0)}</b> match(es) so far</span>`;
  }
  const stream=$("#ffStream");
  if(stream && d.preview && d.preview.length){
    stream.innerHTML=d.preview.slice().sort((a,b)=>b.score-a.score).slice(0,24)
      .map(m=>`<div class="thumb"><img loading="lazy" src="/api/thumb?size=200&path=${encodeURIComponent(m.path)}" alt=""/></div>`).join("");
  }
  if(d.error){$("#ffProgress").innerHTML=`<div class="callout bad" style="margin-top:14px">${esc(d.error)}</div>`;busy(btn,false);return;}
  if(!d.finished){setTimeout(()=>pollHapzea(btn),700);return;}
  busy(btn,false);$("#ffProgress").innerHTML="";
  const res=d.result||{};
  if(res.error==="no_face_in_selfie"){$("#ffOut").innerHTML=`<div class="callout warn" style="margin-top:14px">No face found in the selfie — try a clearer, front-facing photo.</div>`;return;}
  renderHapzeaResults(res);
}
function renderHapzeaResults(res){
  const out=$("#ffOut");
  const matches=(res.matches||[]).slice();
  if(!matches.length){out.innerHTML=`<div class="callout info" style="margin-top:14px">No matches for ${esc(S.ffName||"this person")}. Try a looser strictness or clearer selfie.</div>`;return;}
  // pre-untick low-confidence (Maybe) so the album stays clean by default
  matches.forEach(m=>{m.drop=(m.score<0.50);});
  S.ffMatches=matches;
  const keep=matches.filter(m=>!m.drop).length;
  out.innerHTML=`<div class="callout safe" style="margin-top:14px">Found <b>${num(matches.length)}</b> photo(s). Unsure ones start unticked — zoom to check, tick what to keep, then save.</div>
    <div class="thumbgrid" id="ffGrid"></div>
    <div class="btn-row">
      <button class="btn warn" id="ffSave">Save the album (${num(keep)} photos)</button>
    </div><div id="ffSaveOut"></div>`;
  drawHapzeaGrid();
  $("#ffSave").onclick=saveHapzeaAlbum;
}
function refreshFfSave(){
  const keep=S.ffMatches.filter(x=>!x.drop).length;
  const b=$("#ffSave");if(b){b.innerHTML=`Save the album (${num(keep)} photos)`;b.disabled=!keep;}

function drawHapzeaGrid(){
  const grid=$("#ffGrid");if(!grid)return;
  grid.innerHTML=S.ffMatches.map((mm,i)=>{const b=confBand(mm.score);
    return `<div class="thumb ${mm.drop?'':'sel'}" data-ffi="${i}" title="${esc(mm.path)}">
    <input type="checkbox" class="kp" data-kp="${i}" ${mm.drop?'':'checked'} aria-label="Keep photo"/>
    <button class="zoom" data-zoom="${i}" aria-label="Zoom">${IC.expand}</button>
    <span class="bd"><span class="band ${b.k}">${b.t}</span></span>
    <img loading="lazy" src="/api/thumb?size=300&path=${encodeURIComponent(mm.path)}" alt=""/>
    <div class="nm">${Math.round(mm.score*100)}% match</div></div>`;}).join("");
  grid.querySelectorAll("[data-kp]").forEach(cb=>cb.onclick=e=>{e.stopPropagation();
    const i=+cb.dataset.kp;S.ffMatches[i].drop=!cb.checked;refreshFfSave();
    cb.closest(".thumb").classList.toggle("sel",cb.checked);});
  grid.querySelectorAll("[data-zoom]").forEach(z=>z.onclick=e=>{e.stopPropagation();
    openLightbox(S.ffMatches,+z.dataset.zoom);});
  grid.querySelectorAll("[data-ffi] img").forEach(im=>im.onclick=e=>{
    openLightbox(S.ffMatches,+e.target.closest("[data-ffi]").dataset.ffi);});
}
async function saveHapzeaAlbum(e){
  const keep=S.ffMatches.filter(m=>!m.drop);
  if(!keep.length){toast("Nothing selected","bad");return;}
  const nm=(S.ffName||"Guest").trim();
  const safe=nm.replace(/[^A-Za-z0-9 _-]/g,"").trim().replace(/\s+/g,"_")||"Guest";
  const folder="Hapzea_"+safe;
  const assignments=keep.map(m=>({path:m.path,category:folder}));
  const btn=e.target;busy(btn,true,"Saving album…");
  const out=$("#ffSaveOut");
  try{
    const d=await runApplyJob("categorize/apply/start",
      {backend:S.backend,root:S.root,assignments,copy:true,_verb:"Copied"},out);
    const album=(S.root.replace(/[\\/]+$/,""))+"\\"+folder;
    out.innerHTML=`<div class="callout safe" style="margin-top:12px">Saved <b>${num(d.copied||d.applied)}</b> photo(s) to
      <code>${esc(folder)}</code> — ready to share over WhatsApp or email.
      <div class="btn-row" style="margin-top:8px"><button class="btn ghost sm" id="ffOpen">Open the album folder</button></div></div>`;
    $("#ffOpen").onclick=()=>api("open",{path:album}).catch(()=>toast("Couldn't open folder","bad"));
    toast("Album saved","good");
    api("scan",{backend:S.backend,root:S.root,depth:S.depth}).then(sc=>S.scan=sc).catch(()=>{});
  }catch(err){toast(err.message,"bad");busy(btn,false);}
}

// ---------------------------------------------------------------- background apply job (album copy)
function runApplyJob(startPath,body,host){
  return new Promise((resolve,reject)=>{(async()=>{
    let d;try{d=await api(startPath,body);}catch(err){return reject(err);}
    const jobId=d.jobId;
    const verb=(body&&body._verb)||"Moved";
    host.innerHTML=`<div class="preview" style="margin-top:16px"><div class="ph">
      <div class="chips"><span class="chip" id="apStat">Working…</span></div>
      <button class="btn ghost sm" id="apCancel">Stop</button></div>
      <div style="padding:16px"><div class="track">
        <div id="apBar" class="fill"></div></div>
        <div id="apCount" style="color:var(--mut);font-size:12px;margin-top:8px">Preparing…</div></div></div>`;
    $("#apCancel").onclick=()=>{api("apply/cancel",{jobId}).catch(()=>{});const s=$("#apStat");if(s)s.textContent="Stopping…";};
    const poll=async()=>{
      let pr;try{pr=await api("apply/progress",{jobId});}catch(err){return reject(err);}
      const t=pr.total||0,dn=pr.done||0,pct=t?Math.round(dn/t*100):0;
      const bar=$("#apBar");if(bar)bar.style.width=pct+"%";
      const c=$("#apCount");if(c)c.textContent=t?`${verb} ${num(dn)} of ${num(t)} (${pct}%)`:"Working…";
      if(pr.error)return reject(new Error(pr.error));
      if(!pr.finished){setTimeout(poll,450);return;}
      resolve(pr.result);
    };poll();
  })();});
}

// ---------------------------------------------------------------- theme
function applyTheme(t){document.body.classList.toggle("dark",t==="dark");
  const b=$("#themeBtn");if(b)b.textContent=t==="dark"?"Light":"Dark";}
function initTheme(){let t="";try{t=localStorage.getItem("phorg-theme")||"";}catch(e){}
  if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  applyTheme(t);}
(function(){const b=el("button","themebtn");b.id="themeBtn";b.type="button";
  b.setAttribute("aria-label","Toggle light or dark theme");
  b.onclick=()=>{const t=document.body.classList.contains("dark")?"light":"dark";
    try{localStorage.setItem("phorg-theme",t);}catch(e){}applyTheme(t);};
  document.body.appendChild(b);})();
initTheme();
function maybeOnboard(){
  let seen=1;try{seen=localStorage.getItem("phorg-onboarded");}catch(e){}
  if(seen)return;
  toast("Open your event folder, then share the QR — guests do the rest.","info",6500);
  try{localStorage.setItem("phorg-onboarded","1");}catch(e){}
}

// ---------------------------------------------------------------- boot
const _guestToken=new URLSearchParams(location.search).get("g");
const _albumRef=new URLSearchParams(location.search).get("a");
if(_albumRef){
  setTimeout(()=>initGuestAlbum(_albumRef),40);
}else if(_guestToken){
  setTimeout(()=>initGuestPortal(_guestToken),40);
}else{
  try{const lr=localStorage.getItem("phorg-lastroot");if(lr)S.root=lr;}catch(e){}
  pageHost($("#main"));
  maybeOnboard();
  if(S.root)tryAutoConnect();
}
async function tryAutoConnect(){
  try{
    const d=await api("scan",{backend:"local",root:S.root,depth:S.depth});
    S.scan=d;S.root=d.root;S.connected=true;pushRecent(d.root);
    renderFolderCard();
  }catch(err){/* folder gone/moved — stay on the chooser with it pre-filled */
    const ri=$("#rootIn");if(ri)ri.value=S.root;}
}
// --- drag & drop the event folder onto the window to open it ---
(function(){
  let dragDepth=0;
  const ov=()=>$("#dropOverlay");
  window.addEventListener("dragover",e=>{e.preventDefault();});
  window.addEventListener("dragenter",e=>{e.preventDefault();dragDepth++;
    const o=ov();if(o)o.classList.add("on");});
  window.addEventListener("dragleave",e=>{dragDepth=Math.max(0,dragDepth-1);
    if(!dragDepth){const o=ov();if(o)o.classList.remove("on");}});
  window.addEventListener("drop",e=>{
    e.preventDefault();dragDepth=0;const o=ov();if(o)o.classList.remove("on");
    if(_guestToken)return;                     // guests don't pick folders
    const f=(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0])||null;
    const path=f&&f.path;                      // available in Electron/VS Code browser
    if(!path){toast("Drop couldn't read the folder path here — use Browse instead.","info");return;}
    let root=path;
    if(f.type||/\.[A-Za-z0-9]{1,6}$/.test(path.split(/[\\/]/).pop()||"")){
      root=path.replace(/[\\/][^\\/]*$/,"")||path;}
    connectFolder(root);
  });
})();
</script>
