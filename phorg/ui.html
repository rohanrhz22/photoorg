<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#000062"/>
<title>Hapzea FaceFind — find every guest's photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  /* Hapzea brand — dark black/navy + cyan→blue gradient */
  --bg0:#000000; --navy:#091e4c; --navy2:#0a0f1c;
  --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.09); --line:rgba(255,255,255,.12);
  --txt:#eaf1fb; --mut:#9fb0c9; --mut2:#6f7f9c;
  --accent:#38bdf8; --accent2:#2563eb; --good:#10b981; --warn:#f59e0b; --bad:#ef4444;
  --grad:linear-gradient(135deg,var(--accent),var(--accent2));
  --ring:rgba(56,189,248,.35);
  --shadow:0 20px 45px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-behavior:smooth}
body{margin:0;color:var(--txt);
  font:14px/1.55 'Inter',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  background:linear-gradient(160deg,#000 0%,var(--navy) 48%,#000 100%);
  background-attachment:fixed;}
::selection{background:#38bdf855}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* ambient brand background — grid + glowing blobs */
.bg-decor{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg-decor::before{content:"";position:absolute;inset:0;
  background:linear-gradient(to right,#ffffff08 1px,transparent 1px),
             linear-gradient(to bottom,#ffffff08 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 25%,transparent 78%);
          mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 25%,transparent 78%);}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:pulseSlow 8s ease-in-out infinite}
.blob.b1{width:520px;height:520px;left:-130px;top:-150px;background:radial-gradient(circle,rgba(56,189,248,.55),transparent 70%)}
.blob.b2{width:560px;height:560px;right:-170px;top:-90px;background:radial-gradient(circle,rgba(37,99,235,.5),transparent 70%);animation-delay:1.6s}
.blob.b3{width:480px;height:480px;left:38%;bottom:-240px;background:radial-gradient(circle,rgba(168,85,247,.32),transparent 70%);animation-delay:3.2s}
@keyframes pulseSlow{0%,100%{opacity:.42}50%{opacity:.72}}

/* layout — single, centered FaceFind surface */
.main{padding:34px 24px 80px;max-width:840px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px;margin:4px 2px 26px}
.brandlogo{height:40px;width:auto;object-fit:contain;
  filter:drop-shadow(0 6px 18px rgba(56,189,248,.28));transition:transform .3s;cursor:default}
.brandlogo:hover{transform:scale(1.05)}
.brandbadge{font-size:12px;font-weight:700;letter-spacing:.5px;color:#fff;text-transform:uppercase;
  background:var(--grad);padding:6px 13px;border-radius:999px;box-shadow:0 8px 20px rgba(37,99,235,.4)}
.mainbadge{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#fff;
  background:var(--grad);padding:3px 9px;border-radius:999px;box-shadow:0 4px 12px rgba(37,99,235,.4)}
/* legacy .logo chip (guest portal fallback) */
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;
  background:var(--grad);box-shadow:0 8px 20px rgba(37,99,235,.4)}
.page{animation:fadeIn .32s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(120deg,#fff,#cfe4ff 55%,#c7b6ff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lead{color:var(--mut);margin:0 0 26px;font-size:14.5px;line-height:1.6;max-width:62ch}

/* step tracker */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}
.step{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:500;color:var(--mut2);cursor:pointer;user-select:none;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:7px 15px 7px 8px;transition:.2s}
.step:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateY(-1px)}
.step .sd{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;
  background:rgba(255,255,255,.1);color:var(--mut);transition:.25s}
.step.active{color:#fff;border-color:transparent;background:rgba(56,189,248,.13);box-shadow:0 0 0 1px var(--accent) inset}
.step.active .sd{background:var(--grad);color:#fff}
.step.done{color:var(--mut)}
.step.done .sd{background:rgba(16,185,129,.25);color:#8ff0c4}
@media(max-width:520px){.step .lbl{display:none}}
.prewarm{margin-top:10px;font-size:12px;color:#bfe3ff;display:flex;align-items:center;gap:7px}
.prewarm:empty{display:none}

/* glass cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;
  box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card+.card{margin-top:18px}

label.fld{display:block;margin:16px 0 6px;font-size:12.5px;color:var(--mut);font-weight:600}
input[type=text],select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:12px 14px;font-size:13.5px;font-family:inherit;transition:.18s}
input[type=text]::placeholder{color:var(--mut2)}
input[type=text]:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);
  background:rgba(255,255,255,.06)}
.row{display:flex;gap:10px;align-items:center}
.row input[type=text]{flex:1}

.btn{background:var(--grad);color:#fff;border:0;padding:12px 22px;border-radius:999px;
  font-weight:600;font-size:13.5px;letter-spacing:.2px;transition:all .3s;
  box-shadow:0 10px 24px rgba(37,99,235,.35);display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:scale(1.04);box-shadow:0 14px 30px rgba(56,189,248,.42)}
.btn:active{transform:scale(1)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;filter:saturate(.6)}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--txt);box-shadow:none;
  border:1.5px solid var(--line);backdrop-filter:blur(6px)}
.btn.ghost:hover{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.1)}
.btn.warn{background:linear-gradient(135deg,#fb923c,#ef4444);box-shadow:0 10px 24px rgba(239,68,68,.35)}
.btn.sm{padding:8px 16px;font-size:12.5px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* toggles */
.toggle{display:flex;align-items:center;gap:11px;padding:9px 0;font-size:13px;cursor:pointer}
.toggle input{display:none}
.tk{width:42px;height:23px;border-radius:20px;background:rgba(255,255,255,.14);position:relative;transition:.2s;flex:none}
.tk::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.toggle input:checked+.tk{background:var(--grad)}
.toggle input:checked+.tk::after{left:21px}
.toggle .desc{color:var(--mut);font-size:11.5px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px 22px;margin-top:6px}

/* preview */
.preview{margin-top:18px;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:rgba(255,255,255,.03)}
.preview .ph{padding:14px 18px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.25);border-radius:999px;padding:4px 12px;font-size:11.5px;color:#bfe3ff}
.chip b{color:#fff}

.callout{border-radius:14px;padding:13px 16px;font-size:12.8px;line-height:1.55}
.callout .ic{margin-right:2px}
.callout.flex{display:flex;gap:10px;align-items:center}
.callout.safe{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:#9ff0cd}
.callout.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:#f5d59a}
.callout.info{background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.3);color:#b6e2ff}
.callout.bad{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#f6acac}
.callout code{background:rgba(255,255,255,.09);padding:1px 6px;border-radius:6px;font-size:11.5px}

/* modal */
.overlay{position:fixed;inset:0;background:#01040bcc;backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50}
.modal{width:min(560px,92vw);max-height:82vh;background:linear-gradient(180deg,#0b1220f2,#070b14f5);
  border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
  backdrop-filter:blur(20px)}
.modal .mh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mh h3{margin:0;font-size:16px;font-weight:700}
.modal .mb{padding:12px 12px;overflow:auto}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.crumbs{padding:2px 8px 10px;color:var(--mut);font-size:12px;word-break:break-all}
.fitem{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:12px;cursor:pointer;transition:.14s}
.fitem:hover{background:rgba(56,189,248,.1)}
.fitem .fi{font-size:16px}
.x{background:transparent;border:0;color:var(--mut);font-size:20px;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{background:#ffffff14;color:var(--txt)}

/* toast */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:80}
.toast{min-width:240px;max-width:360px;padding:13px 16px;border-radius:14px;box-shadow:var(--shadow);
  font-size:13px;display:flex;gap:10px;align-items:flex-start;animation:slide .25s ease;
  border:1px solid rgba(255,255,255,.1);background:#1f2937}
.toast.good{border-color:#10b98188}.toast.bad{border-color:#ef444488}.toast.info{border-color:#38bdf888}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

.spin{width:16px;height:16px;border:2.5px solid #ffffff33;border-top-color:var(--accent);border-radius:50%;
  display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.empty .big{font-size:44px;opacity:.5}
.sect-t{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:26px 0 12px}
details.advbox{margin:8px 0 0}
details.advbox>summary{cursor:pointer;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin:18px 0 10px;list-style:none;user-select:none}
details.advbox>summary::-webkit-details-marker{display:none}
details.advbox>summary::before{content:"▸ ";color:var(--accent)}
details.advbox[open]>summary::before{content:"▾ "}
.cardh{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.subhint{color:var(--mut);font-size:11.8px;margin-top:8px;line-height:1.5}

/* thumbnail grid */
.thumbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px;margin-top:8px}
.thumb{position:relative;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;user-select:none;transition:all .3s cubic-bezier(.4,0,.2,1)}
.thumb:hover{transform:translateY(-2px);box-shadow:0 16px 24px rgba(0,0,0,.35)}
.thumb.sel{outline:2px solid var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.thumb img{width:100%;height:92px;object-fit:cover;border-radius:8px;background:#0a1220;display:block}
.thumb .nm{color:var(--mut);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:5px 2px 4px}

/* FaceFind selfie */
.ffselfie{display:flex;gap:14px;align-items:center;margin-top:6px}
.ffprev{width:88px;height:88px;border-radius:16px;border:2px dashed var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;background:rgba(255,255,255,.04);transition:.2s}
.ffprev.drag{border-color:var(--accent);background:rgba(56,189,248,.12)}
.ffprev img{width:100%;height:100%;object-fit:cover}

/* history / guest rows */
.histrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);font-size:13px}
.histrow:first-child{border-top:0}
.histrow .hl{flex:1} .histrow .ht{color:var(--mut2);font-size:11.5px}

/* sliders */
.slider{margin:12px 0}
.slider label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:6px}
.slider label b{color:var(--txt)}
.slider input[type=range]{width:100%;accent-color:var(--accent)}
.slider .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--mut2);margin-top:2px}

/* drag-drop overlay */
#dropOverlay{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;background:#01040bd0;backdrop-filter:blur(6px)}
#dropOverlay.on{display:flex}
#dropOverlay .dropinner{border:3px dashed var(--accent);border-radius:20px;padding:48px 70px;text-align:center;color:var(--txt);font-size:52px;background:rgba(255,255,255,.05)}
#dropOverlay .dropinner div{font-size:16px;margin-top:12px;color:var(--mut)}

/* custom scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.04)}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.5);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.7)}

@media(max-width:760px){.opts{grid-template-columns:1fr}h1{font-size:25px}}

/* --- multi-selfie gallery --- */
.selfies{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.selfie{position:relative;width:74px;height:74px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--bg1,rgba(255,255,255,.04))}
.selfie img{width:100%;height:100%;object-fit:cover;display:block}
.selfie .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:12px;line-height:1;display:grid;place-items:center;cursor:pointer}
.selfieadd{width:74px;height:74px;border-radius:14px;border:2px dashed var(--line);background:rgba(255,255,255,.03);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--mut);font-size:22px;transition:.2s}
.selfieadd:hover{border-color:var(--accent);color:var(--accent)}
.selfieadd span{font-size:10px;font-weight:600}

/* --- confidence bands --- */
.band{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:999px;text-transform:uppercase}
.band.sure{background:rgba(16,185,129,.22);color:#7ff0c4}
.band.likely{background:rgba(56,189,248,.2);color:#bfe3ff}
.band.maybe{background:rgba(245,158,11,.2);color:#f5d59a}
.thumb .kp{position:absolute;top:8px;left:8px;width:20px;height:20px;accent-color:var(--accent);cursor:pointer;z-index:3}
.thumb .bd{position:absolute;bottom:26px;left:8px;z-index:2}
.thumb .zoom{position:absolute;top:8px;right:8px;z-index:3;width:22px;height:22px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:12px;cursor:pointer;display:grid;place-items:center}

/* --- lightbox --- */
.lbov{position:fixed;inset:0;background:#01040bee;backdrop-filter:blur(6px);display:flex;flex-direction:column;z-index:130}
.lbtop{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;gap:10px}
.lbtop .lbn{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbmain{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 12px;min-height:0}
.lbmain img{max-width:84vw;max-height:78vh;object-fit:contain;border-radius:12px;box-shadow:var(--shadow);background:#0a1220}
.lbnav{background:#ffffff16;border:1px solid var(--line);color:#fff;width:46px;height:46px;border-radius:50%;font-size:22px;flex:none;cursor:pointer}
.lbnav:hover{background:#ffffff2b}
.lbfoot{display:flex;gap:8px;justify-content:center;padding:12px 18px 20px;flex-wrap:wrap}

/* --- theme toggle --- */
.themebtn{position:fixed;top:16px;right:18px;z-index:40;background:rgba(255,255,255,.08);border:1px solid var(--line);
  color:var(--txt);border-radius:999px;padding:8px 12px;font-size:12.5px;cursor:pointer;backdrop-filter:blur(8px)}
.themebtn:hover{border-color:var(--accent)}

/* --- light theme --- */
body.light{--bg0:#eef3fb;--navy:#dbe7fb;--navy2:#eaf1fb;
  --card:rgba(255,255,255,.72);--card2:rgba(20,40,90,.06);--line:rgba(20,40,90,.14);
  --txt:#0d1f47;--mut:#41568a;--mut2:#6b7fa8;--shadow:0 14px 34px rgba(20,40,90,.14)}
body.light{background:linear-gradient(160deg,#eaf1fb 0%,#dbe7fb 50%,#eef3fb 100%)}
body.light .toast{background:#ffffff}
body.light .modal,body.light .lbov{background:#eef3fbf2}
body.light .bg-decor::before{background:linear-gradient(to right,#0a2a6608 1px,transparent 1px),linear-gradient(to bottom,#0a2a6608 1px,transparent 1px)}

/* --- QR brand mark --- */
.qrwrap{position:relative;display:inline-block}
.qrwrap .qrlogo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:9px;
  background:#fff;padding:4px;box-shadow:0 2px 8px #0004}

/* --- accessibility --- */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="bg-decor" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<main class="main" id="main"></main>

<div id="modalHost"></div>
<div id="dropOverlay"><div class="dropinner">📂<div>Drop your event folder to open it</div></div></div>
<div id="toasts"></div>

<script src="/qrcode.min.js"></script>
<script>
// ---------------------------------------------------------------- state
const S = {
  connected:false, backend:"local", root:"", depth:3,
  scan:null,
  ffSelfie:"", ffSelfies:[], ffName:"", ffMatches:[], ffJob:null,
  shareEvent:"", shareOnline:true, sharePin:"", shareExpiry:0,
  guestToken:null, guestEvent:"", guestSelfie:null, guestSelfies:[], guestUpload:null, gJob:null, gFails:0,
  shareEnabled:false,
};

// ---------------------------------------------------------------- helpers
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function fmtKb(kb){kb=+kb||0;if(kb>=1048576)return (kb/1048576).toFixed(2)+" GB";
  if(kb>=1024)return (kb/1024).toFixed(1)+" MB";return kb+" KB";}
function num(n){return (+n||0).toLocaleString();}
// Render a scannable QR code into `host`. Works fully offline (vendored lib).
function renderQR(host,text,cell=5,margin=2,ec="M"){
  if(!host)return;
  if(typeof qrcode==="undefined"){host.innerHTML=`<div class="subhint">QR unavailable — use the link above.</div>`;return;}
  try{
    const q=qrcode(0,ec);q.addData(text);q.make();
    host.innerHTML=`<div class="qrwrap" style="display:inline-block;background:#fff;padding:10px;border-radius:12px">${q.createImgTag(cell,margin)}</div>`;
    const img=host.querySelector("img");if(img){img.style.display="block";img.alt="QR code";}
  }catch(e){host.innerHTML=`<div class="subhint">Couldn't build QR — use the link above.</div>`;}
}
async function api(path,body){
  const r = await fetch("/api/"+path,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body||{})});
  const data = await r.json().catch(()=>({error:"Bad response"}));
  if(!r.ok||data.error) throw new Error(data.error||("HTTP "+r.status));
  return data;
}
function toast(msg,kind="info",ms=3800){
  const host=$("#toasts");const t=el("div","toast "+kind);
  const ic={good:"✅",bad:"⚠️",info:"ℹ️"}[kind]||"ℹ️";
  t.innerHTML=`<span>${ic}</span><span>${msg}</span>`;host.appendChild(t);
  setTimeout(()=>{t.style.opacity=0;t.style.transform="translateX(30px)";
    setTimeout(()=>t.remove(),250);},ms);
}
function busy(btn,on,label){
  if(!btn)return;
  if(on){
    if(!btn.dataset.busy){btn.dataset.orig=btn.innerHTML;btn.dataset.busy="1";}
    btn.disabled=true;
    btn.innerHTML=`<span class="spin"></span> ${label||"Working…"}`;}
  else{btn.disabled=false;
    if(btn.dataset.busy){btn.innerHTML=btn.dataset.orig||btn.innerHTML;
      delete btn.dataset.orig;delete btn.dataset.busy;}}
}

// Warm the face cache in the background so the first search is instant.
async function startPrewarm(){
  if(S.backend!=="local"||!S.root)return;
  let r;try{r=await api("facefind/prewarm",{backend:"local",root:S.root});}catch(e){return;}
  if(!r||!r.ok||!r.jobId)return;
  S.prewarmJob=r.jobId;
  pollPrewarm(S.root);
}
async function pollPrewarm(forRoot){
  const wrap=$("#prewarm");
  if(!wrap||S.root!==forRoot)return;
  let d;try{d=await api("cluster/progress",{jobId:S.prewarmJob});}catch(e){wrap.innerHTML="";return;}
  if(d.phase==="downloading"){wrap.innerHTML=`<span class="spin"></span> Preparing AI…`;}
  else if(d.finished){
    wrap.innerHTML=d.error?"":`⚡ Ready — searches are now instant.`;
    if(!d.error)setTimeout(()=>{const w=$("#prewarm");if(w&&S.root===forRoot)w.innerHTML="";},5000);
    return;
  }else{
    const t=d.total||0,dn=d.done||0,pct=t?Math.round(dn/t*100):0;
    wrap.innerHTML=`<span class="spin"></span> Indexing photos for instant search… ${pct}%`;
  }
  setTimeout(()=>pollPrewarm(forRoot),900);
}

let GUEST_OPEN=new Set();   // job ids whose photo preview is expanded
function renderGuestList(d){
  const list=$("#guestList");if(!list)return;
  const cn=$("#guestCount");if(cn)cn.textContent=d.count?`(${num(d.count)})`:"";
  if(!(d.guests&&d.guests.length)){
    list.innerHTML=`<div class="subhint">No one yet.</div>`;return;}
  list.innerHTML=d.guests.map(g=>{
    const time=esc(new Date(g.ts*1000).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}));
    const canPrev=g.done&&g.count>0&&g.matches&&g.matches.length;
    const open=canPrev&&GUEST_OPEN.has(g.job);
    let right;
    if(!g.done)right="<span class='spin'></span> searching";
    else if(g.count==null)right="—";
    else right=`${num(g.count)} photo(s)${g.scanned?` <span style="opacity:.7">/ ${num(g.scanned)} scanned</span>`:""}`;
    const prevBtn=canPrev?`<button class="btn ghost sm gPrevBtn" data-job="${esc(g.job)}">${open?"✕ Hide":"👁 Preview"}</button>`:"";
    const grid=open?`<div class="thumbgrid" style="margin-top:10px">${g.matches.map(p=>`<a class="thumb" href="/api/download?path=${encodeURIComponent(p)}" download>
      <img loading="lazy" src="/api/thumb?size=300&path=${encodeURIComponent(p)}" alt=""/><div class="nm">⬇️ download</div></a>`).join("")}</div>`:"";
    let deliver="";
    if(g.contact){
      const ok=g.notified==="sent";
      const tried=g.done&&g.count>0;
      const badge=ok?`<span style="color:var(--good)">✅ sent</span>`
        :(tried?`<span style="color:var(--warn)" title="${esc(g.notified||"")}">✉️ not sent</span>`:"");
      deliver=`<div class="ht" style="margin-top:3px">✉️ ${esc(g.contact)} ${badge}</div>`;
    }
    return `<div class="histrow" style="display:block">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <span class="hl">🙂 <b>${esc(g.name)}</b> <span class="ht">· ${time}</span></span>
        <span style="color:var(--mut);display:flex;gap:10px;align-items:center">${right}${prevBtn}</span>
      </div>${deliver}${grid}</div>`;
  }).join("");
  list.querySelectorAll(".gPrevBtn").forEach(b=>b.onclick=()=>{
    const j=b.dataset.job;GUEST_OPEN.has(j)?GUEST_OPEN.delete(j):GUEST_OPEN.add(j);
    renderGuestList(d);});
}

    return;}
  if(st.pin_required){renderGuestPin(token);return;}
  S.guestToken=token;S.guestEvent=st.event||"the event";
  // Stop a guest's search on the host when they close or reload the tab, so it
  // doesn't keep running orphaned. Registered once per page.
  if(!S._guestUnloadHook){

}

// -- open the phone's native camera (fallback when live camera is blocked) ---
function openNativeCamera(cb){
  const inp=document.createElement("input");
  inp.type="file";
  inp.accept="image/*";
  inp.capture="user";                       // property form
  inp.setAttribute("capture","user");       // attribute form (Android needs this)
  inp.style.position="fixed";inp.style.left="-9999px";
  document.body.appendChild(inp);           // must be in the DOM for capture
  inp.onchange=e=>{const f=e.target.files&&e.target.files[0];
    try{document.body.removeChild(inp);}catch(_){}
    if(f)cb(f);};
  inp.click();
}

async function guestPoll(btn){
  let d;
  try{d=await api("cluster/progress",{jobId:S.gJob});S.gFails=0;}
  catch(err){
    // The phone reaches the host only while its app is open. A failed poll is
    // usually a brief network blip — retry a few times — but repeated failures
    // (or a lost job after a restart) mean the host went offline: say so and
    // stop, instead of leaving a frozen "Finding…" spinner on screen.
    S.gFails=(S.gFails||0)+1;
    if(S.gFails<4){setTimeout(()=>guestPoll(btn),1500);return;}
    busy(btn,false);
    $("#gProgress").innerHTML=`<div class="callout warn" style="margin-top:14px">⚠️ Lost connection to the host. The photo app was probably closed or sharing was stopped. Please try again when the host is back online.</div>`;
    return;
  }
  const bar=$("#gBar"),pc=$("#gCount"),tally=$("#gTally");
  if(d.phase==="downloading"){const mt=d.model_total||0,md=d.model_done||0,mp=mt?Math.round(md/mt*100):0;
    if(bar)bar.style.width=mp+"%";if(pc)pc.textContent=`Getting ready ${mp}%…`;}
  else{const total=d.total||0,done=d.done||0,pct=total?Math.round(done/total*100):0;
    if(bar)bar.style.width=pct+"%";if(pc)pc.textContent=total?`Checked ${num(done)} of ${num(total)} (${pct}%)`:"Scanning…";
    if(tally)tally.innerHTML=`<span class="chip">🙂 ${num(d.clusters||0)} so far</span>`;}
  if(d.error){$("#gProgress").innerHTML=`<div class="callout bad" style="margin-top:14px">${esc(d.error)}</div>`;busy(btn,false);return;}
  if(!d.finished){setTimeout(()=>guestPoll(btn),700);return;}
  busy(btn,false);$("#gProgress").innerHTML="";
  const res=d.result||{};
  if(res.error==="no_face_in_selfie"){$("#gOut").innerHTML=`<div class="callout warn" style="margin-top:14px">😕 No face found in your selfie. Try a clearer, front-facing photo.</div>`;return;}
  const m=(res.matches||[]);
  if(!m.length){$("#gOut").innerHTML=`<div class="callout info" style="margin-top:14px">No photos found yet. Try a clearer selfie.</div>`;return;}
  $("#gOut").innerHTML=`<div class="callout safe" style="margin-top:14px">✅ Found <b>${num(m.length)}</b> photo(s) you're in — tap to download, or grab them all.</div>
    <div class="btn-row"><a class="btn" href="/api/download/zip?job=${encodeURIComponent(S.gJob)}&token=${encodeURIComponent(S.guestToken)}" download>⬇️ Download all (${num(m.length)})</a>
      <button class="btn ghost" id="gShare" style="display:none">📤 Share event</button></div>
    <div class="thumbgrid">${m.map((x,i)=>`<div class="thumb" data-gi="${i}">
      <button class="zoom" data-gz="${i}" aria-label="Zoom">⤢</button>
      <a href="/api/download?path=${encodeURIComponent(x.path)}" download>
        <img loading="lazy" src="/api/thumb?size=400&path=${encodeURIComponent(x.path)}" alt=""/>
        <div class="nm">⬇️ download</div></a></div>`).join("")}</div>`;
  const gs=$("#gShare");
  if(gs&&navigator.share){gs.style.display="";gs.onclick=()=>navigator.share(
    {title:S.guestEvent,text:"Find your photos from "+S.guestEvent,url:location.href}).catch(()=>{});}
  $("#gOut").querySelectorAll("[data-gz]").forEach(z=>z.onclick=e=>{e.preventDefault();e.stopPropagation();
    openLightbox(m,+z.dataset.gz);});
  if(S.gRid&&S.gAtoken){
    const link=location.origin+"/?a="+S.gRid+"."+S.gAtoken;
    $("#gOut").insertAdjacentHTML("beforeend",
      `<div class="callout info" style="margin-top:12px">🔖 Save your private album link to come back anytime:
        <div class="btn-row" style="margin-top:8px"><input id="gLink" readonly value="${esc(link)}" style="flex:1;min-width:0"/>
        <button class="btn ghost sm" id="gCopy">Copy</button></div></div>`);
    const cp=$("#gCopy");if(cp)cp.onclick=()=>{try{navigator.clipboard.writeText(link);toast("Link copied","good");}catch(e){const i=$("#gLink");if(i){i.select();document.execCommand("copy");toast("Link copied","good");}}};
  }
}

// confidence band from a cosine score
function confBand(score){
  if(score>=0.62)return{k:"sure",t:"Sure"};
  if(score>=0.50)return{k:"likely",t:"Likely"};
  return{k:"maybe",t:"Maybe"};
}
// full-size preview of a list of {path,score} at index i
function openLightbox(list,i){
  const host=$("#modalHost");let idx=i;
  const close=()=>{host.innerHTML="";document.removeEventListener("keydown",key);};
  const key=e=>{if(e.key==="Escape")close();else if(e.key==="ArrowLeft"){idx=(idx-1+list.length)%list.length;draw();}else if(e.key==="ArrowRight"){idx=(idx+1)%list.length;draw();}};
  const draw=()=>{
    const it=list[idx];const b=confBand(it.score||0);
    host.innerHTML=`<div class="lbov" id="lbov">
      <div class="lbtop"><span class="lbn">${esc((it.path||"").split(/[\\/]/).pop())}</span>
        <button class="x" id="lbX" aria-label="Close">×</button></div>
      <div class="lbmain">
        <button class="lbnav" id="lbPrev" aria-label="Previous">‹</button>
        <img src="/api/thumb?size=1400&path=${encodeURIComponent(it.path)}" alt=""/>
        <button class="lbnav" id="lbNext" aria-label="Next">›</button></div>
      <div class="lbfoot"><span class="band ${b.k}">${b.t}</span>
        <span class="chip">${Math.round((it.score||0)*100)}% match</span>
        <a class="btn sm" href="/api/download?path=${encodeURIComponent(it.path)}" download>⬇️ Download</a></div>
    </div>`;
    $("#lbX").onclick=close;
    $("#lbov").onclick=e=>{if(e.target===$("#lbov"))close();};
    $("#lbPrev").onclick=()=>{idx=(idx-1+list.length)%list.length;draw();};
    $("#lbNext").onclick=()=>{idx=(idx+1)%list.length;draw();};
  };
  document.addEventListener("keydown",key);draw();
}

  if(d.phase==="downloading"){
    const mt=d.model_total||0,md=d.model_done||0,mp=mt?Math.round(md/mt*100):0;
    if(bar)bar.style.width=mp+"%";if(pc)pc.textContent=`Downloading face model ${mp}% (one-time)…`;
    if(tally)tally.innerHTML=`<span class="chip">Setting up AI…</span>`;
  }else{
    const total=d.total||0,done=d.done||0,pct=total?Math.round(done/total*100):0;
    if(bar)bar.style.width=pct+"%";
    if(pc)pc.textContent=total?`Checked ${num(done)} of ${num(total)} photos (${pct}%)`:"Scanning…";
    if(tally)tally.innerHTML=`<span class="chip">🙂 ${num(d.clusters||0)} match(es) so far</span>`;
  }
  const stream=$("#ffStream");
  if(stream && d.preview && d.preview.length){
    stream.innerHTML=d.preview.slice().sort((a,b)=>b.score-a.score).slice(0,24)
      .map(m=>`<div class="thumb"><img loading="lazy" src="/api/thumb?size=200&path=${encodeURIComponent(m.path)}" alt=""/></div>`).join("");
  }
  if(d.error){$("#ffProgress").innerHTML=`<div class="callout bad" style="margin-top:14px">${esc(d.error)}</div>`;busy(btn,false);return;}
  if(!d.finished){setTimeout(()=>pollFaceFind(btn),700);return;}
  busy(btn,false);$("#ffProgress").innerHTML="";
  const res=d.result||{};
  if(res.error==="no_face_in_selfie"){$("#ffOut").innerHTML=`<div class="callout warn" style="margin-top:14px">😕 No face found in the selfie. Try a clearer, front-facing photo.</div>`;return;}
  renderFaceFindResults(res);
}
function renderFaceFindResults(res){
  const out=$("#ffOut");
  const matches=(res.matches||[]).slice();
  if(!matches.length){out.innerHTML=`<div class="callout info" style="margin-top:14px">No matches for ${esc(S.ffName||"this person")}. Try a looser strictness or clearer selfie.</div>`;return;}
  // pre-untick low-confidence (Maybe) so the album stays clean by default
  matches.forEach(m=>{m.drop=(m.score<0.50);});
  S.ffMatches=matches;
  const keep=matches.filter(m=>!m.drop).length;
  out.innerHTML=`<div class="callout safe" style="margin-top:14px">✅ Found <b>${num(matches.length)}</b> photo(s). Low-confidence ones are pre-unticked — tap a photo to zoom, tick/untick, then save.</div>
    <div class="thumbgrid" id="ffGrid"></div>
    <div class="btn-row">
      <button class="btn warn" id="ffSave">💾 Save album (${num(keep)} copies)</button>
    </div><div id="ffSaveOut"></div>`;
  drawFaceFindGrid();
  $("#ffSave").onclick=saveFaceFindAlbum;
}
function refreshFfSave(){
  const keep=S.ffMatches.filter(x=>!x.drop).length;
  const b=$("#ffSave");if(b){b.innerHTML=`💾 Save album (${num(keep)} copies)`;b.disabled=!keep;}
}
function drawFaceFindGrid(){
  const grid=$("#ffGrid");if(!grid)return;
  grid.innerHTML=S.ffMatches.map((mm,i)=>{const b=confBand(mm.score);
    return `<div class="thumb ${mm.drop?'':'sel'}" data-ffi="${i}" title="${esc(mm.path)}">
    <input type="checkbox" class="kp" data-kp="${i}" ${mm.drop?'':'checked'} aria-label="Keep photo"/>
    <button class="zoom" data-zoom="${i}" aria-label="Zoom">⤢</button>
    <span class="bd"><span class="band ${b.k}">${b.t}</span></span>
    <img loading="lazy" src="/api/thumb?size=300&path=${encodeURIComponent(mm.path)}" alt=""/>
    <div class="nm">${Math.round(mm.score*100)}% match</div></div>`;}).join("");
  grid.querySelectorAll("[data-kp]").forEach(cb=>cb.onclick=e=>{e.stopPropagation();
    const i=+cb.dataset.kp;S.ffMatches[i].drop=!cb.checked;refreshFfSave();
    cb.closest(".thumb").classList.toggle("sel",cb.checked);});
  grid.querySelectorAll("[data-zoom]").forEach(z=>z.onclick=e=>{e.stopPropagation();
    openLightbox(S.ffMatches,+z.dataset.zoom);});
  grid.querySelectorAll("[data-ffi] img").forEach(im=>im.onclick=e=>{
    openLightbox(S.ffMatches,+e.target.closest("[data-ffi]").dataset.ffi);});
}
async function saveFaceFindAlbum(e){
  const keep=S.ffMatches.filter(m=>!m.drop);
  if(!keep.length){toast("Nothing selected","bad");return;}
  const nm=(S.ffName||"Guest").trim();
  const safe=nm.replace(/[^A-Za-z0-9 _-]/g,"").trim().replace(/\s+/g,"_")||"Guest";
  const folder="FaceFind_"+safe;
  const assignments=keep.map(m=>({path:m.path,category:folder}));
  const btn=e.target;busy(btn,true,"Saving album…");
  const out=$("#ffSaveOut");
  try{
    const d=await runApplyJob("categorize/apply/start",
      {backend:S.backend,root:S.root,assignments,copy:true,_verb:"Copied"},out);
    const album=(S.root.replace(/[\\/]+$/,""))+"\\"+folder;
    out.innerHTML=`<div class="callout safe" style="margin-top:12px">✅ Saved <b>${num(d.copied||d.applied)}</b> photo(s) to
      <code>${esc(folder)}</code>. Share it via WhatsApp/email.
      <div class="btn-row" style="margin-top:8px"><button class="btn ghost sm" id="ffOpen">📂 Open album folder</button></div></div>`;
    $("#ffOpen").onclick=()=>api("open",{path:album}).catch(()=>toast("Couldn't open folder","bad"));
    toast("Album saved","good");
    api("scan",{backend:S.backend,root:S.root,depth:S.depth}).then(sc=>S.scan=sc).catch(()=>{});
  }catch(err){toast(err.message,"bad");busy(btn,false);}
}

// ---------------------------------------------------------------- background apply job (album copy)
function runApplyJob(startPath,body,host){
  return new Promise((resolve,reject)=>{(async()=>{
    let d;try{d=await api(startPath,body);}catch(err){return reject(err);}
    const jobId=d.jobId;
    const verb=(body&&body._verb)||"Moved";
    host.innerHTML=`<div class="preview" style="margin-top:16px"><div class="ph">
      <div class="chips"><span class="chip" id="apStat">⚡ Working…</span></div>
      <button class="btn ghost sm" id="apCancel">Stop</button></div>
      <div style="padding:14px 18px"><div class="track" style="display:block;height:14px;border-radius:8px;background:#0d1424;border:1px solid #23324e;overflow:hidden">
        <div id="apBar" class="fill" style="display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2))"></div></div>
        <div id="apCount" style="color:var(--mut);font-size:12px;margin-top:8px">Preparing…</div></div></div>`;
    $("#apCancel").onclick=()=>{api("apply/cancel",{jobId}).catch(()=>{});const s=$("#apStat");if(s)s.textContent="Stopping…";};
    const poll=async()=>{
      let pr;try{pr=await api("apply/progress",{jobId});}catch(err){return reject(err);}
      const t=pr.total||0,dn=pr.done||0,pct=t?Math.round(dn/t*100):0;
      const bar=$("#apBar");if(bar)bar.style.width=pct+"%";
      const c=$("#apCount");if(c)c.textContent=t?`${verb} ${num(dn)} of ${num(t)} (${pct}%)`:"Working…";
      if(pr.error)return reject(new Error(pr.error));
      if(!pr.finished){setTimeout(poll,450);return;}
      resolve(pr.result);
    };poll();
  })();});
}

// ---------------------------------------------------------------- theme
function applyTheme(t){document.body.classList.toggle("light",t==="light");
  const b=$("#themeBtn");if(b)b.textContent=t==="light"?"🌙 Dark":"☀️ Light";}
function initTheme(){let t="dark";try{t=localStorage.getItem("phorg-theme")||"dark";}catch(e){}applyTheme(t);}
(function(){const b=el("button","themebtn");b.id="themeBtn";b.type="button";
  b.setAttribute("aria-label","Toggle light or dark theme");
  b.onclick=()=>{const t=document.body.classList.contains("light")?"dark":"light";
    try{localStorage.setItem("phorg-theme",t);}catch(e){}applyTheme(t);};
  document.body.appendChild(b);})();
initTheme();
function maybeOnboard(){
  let seen=1;try{seen=localStorage.getItem("phorg-onboarded");}catch(e){}
  if(seen)return;
  toast("👋 Open your event folder, share the QR — guests find their own photos.","info",6500);
  try{localStorage.setItem("phorg-onboarded","1");}catch(e){}
}

// ---------------------------------------------------------------- boot
const _guestToken=new URLSearchParams(location.search).get("g");
const _albumRef=new URLSearchParams(location.search).get("a");
if(_albumRef){
  setTimeout(()=>initGuestAlbum(_albumRef),40);
}else if(_guestToken){
  setTimeout(()=>initGuestPortal(_guestToken),40);
}else{
  try{const lr=localStorage.getItem("phorg-lastroot");if(lr)S.root=lr;}catch(e){}
  pageHost($("#main"));
  maybeOnboard();
  if(S.root)tryAutoConnect();
}
async function tryAutoConnect(){
  try{
    const d=await api("scan",{backend:"local",root:S.root,depth:S.depth});
    S.scan=d;S.root=d.root;S.connected=true;pushRecent(d.root);
    renderFolderCard();
  }catch(err){/* folder gone/moved — stay on the chooser with it pre-filled */
    const ri=$("#rootIn");if(ri)ri.value=S.root;}
}
// --- drag & drop the event folder onto the window to open it ---
(function(){
  let dragDepth=0;
  const ov=()=>$("#dropOverlay");
  window.addEventListener("dragover",e=>{e.preventDefault();});
  window.addEventListener("dragenter",e=>{e.preventDefault();dragDepth++;
    const o=ov();if(o)o.classList.add("on");});
  window.addEventListener("dragleave",e=>{dragDepth=Math.max(0,dragDepth-1);
    if(!dragDepth){const o=ov();if(o)o.classList.remove("on");}});
  window.addEventListener("drop",e=>{
    e.preventDefault();dragDepth=0;const o=ov();if(o)o.classList.remove("on");
    if(_guestToken)return;                     // guests don't pick folders
    const f=(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0])||null;
    const path=f&&f.path;                      // available in Electron/VS Code browser
    if(!path){toast("Drop couldn't read the folder path here — use 📂 Browse instead.","info");return;}
    let root=path;
    if(f.type||/\.[A-Za-z0-9]{1,6}$/.test(path.split(/[\\/]/).pop()||"")){
      root=path.replace(/[\\/][^\\/]*$/,"")||path;}
    connectFolder(root);
  });
})();
</script>
